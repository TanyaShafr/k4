function reviewOneBlock(b,an,row){
 {
   const r=exScore(b,an),ok=r.s===r.t;
   if(b.kind==="mcq")return row(ok,b.q,b.opts[an.choice]||"Нет ответа",b.opts[b.ok]);
   if(b.kind==="multi")return row(ok,b.q,(an.multi||[]).map(j=>b.opts[j]).join("; ")||"Нет ответа",b.ok.map(j=>b.opts[j]).join("; "));
   if(b.kind==="match"){
     const mp=an.map||{};
     return `<div class="reviewrow ${ok?"":"bad"}"><b>${ok?"✓ Всё верно":"✕ Проверь соединения"} · ${esc(b.q)}</b>
       <div class="reviewgrid" style="margin-top:10px">${b.pairs.map((p,j)=>{
         const picked=Number(mp[j]),pairOk=picked===j;
         const your=Number.isInteger(picked)&&b.pairs[picked]?b.pairs[picked].d:"Нет ответа";
         return `<div class="reviewrow ${pairOk?"":"bad"}"><b><span class="ricon">${micon(p.i1)}</span>${esc(p.t)}</b><div class="reviewanswers">
           <div class="answerbox mine ${pairOk?"":"wrong"}"><span class="alabel">ТЫ СОЕДИНИЛ</span><strong>${esc(your)}</strong></div>
           <div class="answerbox correct"><span class="alabel">ПРАВИЛЬНАЯ ПАРА</span><strong>${esc(p.d)}</strong></div>
         </div></div>`;}).join("")}</div></div>`;
   }
   if(b.kind==="order")return row(ok,b.q,(an.order||[]).map((j,pos)=>`${pos+1}. ${ordText(b.steps[j])}`).join("; ")||"Нет ответа",
     b.steps.map((s,j)=>`${j+1}. ${ordText(s)}`).join("; "));
   if(b.kind==="yn"){
     const y=an.yn||{};
     return `<div class="reviewrow ${ok?"":"bad"}"><b>${ok?"✓ Всё верно":"✕ Есть ошибки"} · ${esc(b.q)}</b>
     <div class="reviewgrid" style="margin-top:10px">${b.items.map((x,j)=>row(y[j]===x.ok,x.q,y[j]===true?"Верно":(y[j]===false?"Неверно":"Нет ответа"),x.ok?"Верно":"Неверно")).join("")}</div></div>`;
   }
   if(b.kind==="decode"){
     const your=b.cells.map((c,j)=>decodeLabel(b,(an.slots||{})[j])).join(" ");
     const cor=b.answer.map(v=>decodeLabel(b,v)).join(" ");
     return row(ok,b.q,your,cor);
   }
   return "";
 }
}
function reviewStage(stage,rec){
 const T=LESSON.stages[stage].task,a=(rec&&rec.answers)||{};
 const row=(ok,title,your,correct)=>`<div class="reviewrow ${ok?"":"bad"}"><b>${ok?"✓ Верно":"✕ Есть ошибка"} · ${esc(title)}</b>
   ${your!==undefined?`<div class="reviewanswers">
     <div class="answerbox mine ${ok?"":"wrong"}"><span class="alabel">ТВОЙ ОТВЕТ</span><strong>${esc(your)}</strong></div>
     <div class="answerbox correct"><span class="alabel">ПРАВИЛЬНЫЙ ОТВЕТ</span><strong>${esc(correct!==undefined?correct:your)}</strong></div>
   </div>`:""}</div>`;
 if(T.type==="exam")return reviewBlocks(T.blocks,a.ex||{});
 let body="";
 if(T.type==="sort"){
   const z=a.zone||{},byKey=Object.fromEntries(T.zones.map(v=>[v.k,v.t]));
   body=T.items.map((x,i)=>row(z[i]===x.zone,x.t,byKey[z[i]]||"Не размещено",byKey[x.zone])).join("");
 }
 if(T.type==="cases"){
   const sel=a.sel||[],safe=T.mode==="safe";
   body=T.cases.map((x,i)=>{const got=sel.includes(i),want=safe?!x.bad:x.bad;
     return row(got===want,x.t,got?"Отмечено":"Не отмечено",want?"Надо было отметить":"Отмечать не нужно");}).join("");
 }
 if(T.type==="yesno"){
   const y=a.yn||{};
   body=T.items.map((x,i)=>row(y[i]===x.ok,x.q,y[i]===true?"Да":(y[i]===false?"Нет":"Нет ответа"),x.ok?"Да":"Нет")).join("");
 }
 if(!body)return "";
 return `<div class="card reviewcard"><div class="reviewhead"><span class="ric">${I.chk}</span>
   <div><h3>Твои ответы и ошибки</h3><p>Зелёным отмечены верные ответы. Красным показано, что нужно исправить.</p></div></div>
   <div class="reviewgrid">${body}</div></div>`;
}

/* --- прогресс миссии --- */
function progressPercent(){
 const T=LESSON.stages[V.state.stage].task,d=V.draft;
 if(T.type==="sort")return Math.round(Object.keys(d.zone||{}).length/T.items.length*100);
 if(T.type==="cases")return Math.min(100,Math.round((d.sel||[]).length/(T.required||T.cases.length)*100));
 if(T.type==="yesno")return Math.round(Object.keys(d.yn||{}).length/T.items.length*100);
 if(T.type==="exam")return Math.round((T.blocks.filter((b,i)=>exReady(b,(d.ex||{})[i])).length+(T.moods&&d.mood?1:0))/(T.blocks.length+(T.moods?1:0))*100);
 return 0;
}

/* --- переходы --- */
async function createRoom(){
 const b=el.querySelector("#create");
 if(!onlineConfigured()){toast("Сначала подключи Supabase");return;}
 b.disabled=true;b.textContent="Проверяем соединение…";
 if(!(await S.ping())){toast(onlineHint());b.disabled=false;b.textContent="Создать занятие";return;}
 b.textContent="Создаём…";
 let code;
 for(let t=0;t<12;t++){
  const candidate=String(Math.floor(1000+Math.random()*9000));const existing=await S.get(kState(candidate));
  if(syncError){toast(onlineHint());b.disabled=false;b.textContent="Создать занятие";return;}
  if(!existing){code=candidate;break;}}
 if(!code){toast("Не удалось выбрать свободный код. Попробуй ещё раз.");b.disabled=false;b.textContent="Создать занятие";return;}
 const st={stage:0,phase:"poll1",removed:[],updated:Date.now()};
 if(!(await S.set(kState(code),st))){toast(onlineHint());b.disabled=false;b.textContent="Создать занятие";return;}
 V.code=code;V.state=st;V.students=[];V.screen="teacher";rememberSession();render();startPoll("teacher");
}
async function gotoStage(n){
 if(V.screen!=="teacher"||n<0||n>=LESSON.stages.length)return;
 if(n>V.state.stage&&(!groupDone()||n!==V.state.stage+1)){toast("Сначала дождись ответов всей группы");return;}
 sparkStop();V.spark=null;
 await commitStage({...V.state,stage:n,phase:"poll1",reveal:false,taskReveal:false,updated:Date.now()});
}
async function finishLesson(){
 if(!V.code||!V.state||V.screen!=="teacher"||!groupDone())return;
 const b=el.querySelector("#next");
 if(b){b.disabled=true;b.textContent="Завершаем…";}
 const last=LESSON.stages.length-1;
 V.state={...V.state,stage:last,phase:"finished",updated:Date.now()};
 const ok=await S.set(kState(V.code),V.state);
 if(!ok){V.state={...V.state,stage:last,phase:"task",updated:Date.now()};
   toast("Не удалось завершить урок — попробуй ещё раз");render();return;}
 V.deck={set:"answer",i:0,zoom:false};V.notes=false;render();
}
async function submitTask(){
 if(V.screen!=="student"||V.state.phase!=="task"||!taskReady()||!V.draft.conf||V.me.stages[V.state.stage])return;
 const b=el.querySelector("#submit");if(b.disabled)return;b.disabled=true;b.textContent="Отправляем…";
 clearTimeout(progressTimer);await progressWrite;
 const latest=await S.get(kState(V.code));
 if(!latest||latest.stage!==V.state.stage||latest.phase!=="task"){toast("Этап изменился или нет связи. Ответ пока не отправлен.");render();return;}
 const r=scoreTask(),next=JSON.parse(JSON.stringify(V.me));
 next.stages[V.state.stage]={score:r.score,total:r.total,at:Date.now(),conf:V.draft.conf,answers:JSON.parse(JSON.stringify(V.draft))};
 if(V.draft.mood)next.mood=V.draft.mood;
 next.active=false;next.progress={stage:V.state.stage,percent:100};
 if(!await S.set(kStu(V.code,V.sid),next)){toast("Не удалось отправить. Ответ сохранён на экране — попробуй ещё раз.");render();return;}
 V.me=next;V.draft={};V.bdraft={};V.bonusOpen=false;V.justSubmitted=true;rememberSession();render();
}

/* --- опрос учителя: учитываем открытие и искры --- */
async function pollTeacher(){
 if(!V.code)return;
 const rows=await S.entries(pStu(V.code));
 if(syncError)return;
 const removed=new Set((V.state&&V.state.removed)||[]);
 const out=rows.map(r=>r.value).filter(s=>s&&!removed.has(s.id));
 rows.forEach(r=>{if(r.value&&removed.has(r.value.id))S.del(kStu(V.code,r.value.id));});
 out.sort((a,b)=>(a.joined||0)-(b.joined||0));
 const sig=x=>JSON.stringify(x.map(s=>[s.id,s.name,s.role,s.active,s.mood,
   Object.entries(s.stages||{}).map(([k,v])=>k+":"+v.conf+":"+v.score).join(","),
   JSON.stringify(s.polls||{}),JSON.stringify(s.progress||{}),
   JSON.stringify(s.disc||{}),JSON.stringify(s.pair||{}),
   Object.entries(s.bonus||{}).map(([k,v])=>k+":"+v.score).join(",")]));
 const ch=sig(out)!==sig(V.students);V.students=out;
 if(V.screen==="teacher"&&V.state&&V.state.phase==="pairs"){
   const fixed=reconcilePairs(out);
   if(fixed){await commitStage({...V.state,pairsMap:fixed,updated:Date.now()});return;}
 }
 if(ch&&V.screen==="teacher")render();
}

/* --- рендер --- */
function render(){
 let h="";
 V.bonusMode=false;
 if(V.screen==="landing")h=vLanding();
 else if(V.screen==="tstart")h=vTeacherStart();
 else if(V.screen==="teacher")h=(V.warm&&V.warm.on)?vWarmTeacher():vTeacher();
 else if(V.screen==="join")h=vJoin();
 else if(V.screen==="student"){
   const st=V.state;
   if(!st)h=vJoin();
   else if(st.warm)h=vWarmStudent();
   else if(st.phase==="poll1"||st.phase==="poll2")h=(LESSON.stages[st.stage].poll?vPoll():vWait());
   else if(V.me.stages&&V.me.stages[st.stage]){V.bonusMode=true;h=vSent();}
   else if(st.phase==="discover")h=vDiscover();
   else if(st.phase==="task")h=vTask();
   else h=vWait();
 }
 el.innerHTML=h+(V.screen==="teacher"?vOverlay():"");
 bind();bindExtra();bindMatch();queueProgress();
}

/* Строчка под названием урока раньше была записана словами и врала: в ней
   стояло «пять кибермиссий» и обещались открытия между этапами и фраза
   учителя — а в уроке «без лишнего» этих механик нет, и этапов бывает не
   пять. Собираем её из самого урока, чтобы учитель видел то, что есть. */
/* Сколько в уроке миссий — пишем числом из самого урока. Раньше в досье
   стояло «пять миссий» словами, и в игре из четырёх станций это была ложь. */
function missionsLine(){
 const n=LESSON.stages.length;
 const w=["","одна миссия","две миссии","три миссии","четыре миссии",
          "пять миссий","шесть миссий","семь миссий","восемь миссий"];
 const t="В лаборатории "+(w[n]||(n+" миссий"));
 return t.charAt(0).toUpperCase()+t.slice(1);
}

function startLine(){
 const n=LESSON.stages.length;
 const words=["","одна кибермиссия","две кибермиссии","три кибермиссии","четыре кибермиссии",
              "пять кибермиссий","шесть кибермиссий","семь кибермиссий","восемь кибермиссий"];
 const head=words[n]||(n+" кибермиссий");
 const parts=[];
 if(LESSON.stages.some(s=>s.discover)) parts.push("между ними дети сами читают открытия");
 if(LESSON.stages.some(s=>s.spark))    parts.push("вы говорите одну фразу на этапе");
 if(LESSON.stages.some(s=>s.pairs))    parts.push("работа в парах");
 if(typeof WARM!=="undefined"&&WARM.length) parts.push("динамическая пауза");
 if(LESSON.shield) parts.push("сбор щита модуля");
 const all=head+(parts.length?", "+parts.join(", "):"");
 return all.charAt(0).toUpperCase()+all.slice(1)+".";
}

/* ===================== РАЗМИНКА: звук, голос, три действия ===================== */
const WRULE=k=>WARMRULES.find(r=>r.k===k)||WARMRULES[0];
let _AC=null,_musicStop=null,_voicesReady=false;
function audioCtx(){
 try{ if(!_AC)_AC=new (window.AudioContext||window.webkitAudioContext)();
      if(_AC.state==="suspended")_AC.resume(); }catch(e){_AC=null;}
 return _AC;
}
function blip(freq,dur,type,vol){
 if(!(V.warm&&V.warm.music))return;
 const ac=audioCtx();if(!ac)return;
 const o=ac.createOscillator(),g=ac.createGain();
 o.type=type||"triangle";o.frequency.value=freq;
 g.gain.setValueAtTime(0,ac.currentTime);
 g.gain.linearRampToValueAtTime(vol===undefined?.22:vol,ac.currentTime+.012);
 g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(dur||.18));
 o.connect(g);g.connect(ac.destination);
 o.start();o.stop(ac.currentTime+(dur||.18)+.03);
}
function musicStop(){ if(_musicStop){try{_musicStop();}catch(e){} _musicStop=null;} }
function musicStart(beatMs){
 musicStop();
 if(!(V.warm&&V.warm.music))return;
 const ac=audioCtx();if(!ac)return;
 const bus=ac.createGain();bus.gain.value=.13;bus.connect(ac.destination);
 const scale=[220,261.63,293.66,349.23,392];
 const beat=Math.max(.35,beatMs/2000);
 let t=ac.currentTime+.08,step=0;
 const id=setInterval(()=>{
  if(!(V.warm&&V.warm.music)){musicStop();return;}
  const now=ac.currentTime;
  while(t<now+.5){
   const o=ac.createOscillator(),g=ac.createGain();
   o.type="sine";o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(52,t+.11);
   g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);
   o.connect(g);g.connect(bus);o.start(t);o.stop(t+.22);
   if(step%2===0){
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.type="triangle";o2.frequency.value=scale[(step/2)%scale.length]*2;
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.2,t+.02);
    g2.gain.exponentialRampToValueAtTime(.001,t+beat*.85);
    o2.connect(g2);g2.connect(bus);o2.start(t);o2.stop(t+beat);
   }
   t+=beat;step++;
  }
 },140);
 _musicStop=()=>{clearInterval(id);try{bus.disconnect();}catch(e){}};
}
function primeVoices(){
 try{const ss=window.speechSynthesis;if(!ss)return;
  ss.getVoices();
  if(!_voicesReady){_voicesReady=true;ss.onvoiceschanged=()=>{ss.getVoices();};}
 }catch(e){}
}
/* кавычки, тире и точки-разделители голос проговаривает вслух — убираем их из озвучки,
   на экране текст остаётся как есть */
function speakable(t){
 return String(t==null?"":t)
   .replace(/[«»„“”"‘’‚‛`«»]/g," ")
   .replace(/[–—−\-]/g," ")
   .replace(/[·•*_#~^\[\]\(\)\{\}<>\/\\|]/g," ")
   .replace(/\s{2,}/g," ")
   .trim();
}
function sayOut(text,rate){
 if(!(V.warm&&V.warm.voice))return;
 try{
  const ss=window.speechSynthesis;if(!ss)return;
  ss.cancel();
  const said=speakable(text);
  if(!said)return;
  const u=new SpeechSynthesisUtterance(said);
  u.lang="ru-RU";u.rate=rate||1;u.pitch=1.05;u.volume=1;
  const v=(ss.getVoices()||[]).find(x=>/^ru/i.test(x.lang||""));
  if(v)u.voice=v;
  ss.speak(u);
 }catch(e){}
}
function sayStop(){try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}}

const _exReadyBase=exReady, _exScoreBase=exScore, _examBodyBase=examBody, _reviewBlocksBase=reviewBlocks;
exReady=function(b,a){
 if(!a)return false;
 if(b.kind==="hotspot"){const p=a.pick||{};return b.items.every((x,i)=>p[i]!==undefined);}
 if(b.kind==="grid2"){const g=a.g||{};return b.items.every((x,i)=>g[i]&&g[i].need!==undefined&&g[i].truth!==undefined);}
 return _exReadyBase(b,a);
};
exScore=function(b,a){
 a=a||{};
 if(b.kind==="hotspot"){const p=a.pick||{};let s=0;b.items.forEach((x,i)=>{if(p[i]===x.ok)s++;});return{s,t:b.items.length};}
 if(b.kind==="grid2"){const g=a.g||{};let s=0;b.items.forEach((x,i)=>{const r=g[i]||{};
   if(r.need===!!x.need)s++; if(r.truth===!!x.truth)s++;});return{s,t:b.items.length*2};}
 return _exScoreBase(b,a);
};
examBody=function(T,d){
 const extra=T.blocks.filter(b=>b.kind==="hotspot"||b.kind==="grid2");
 if(!extra.length)return _examBodyBase(T,d);

 const lab={hotspot:"НАЖМИ НА КАРТИНКЕ",grid2:"ДВА ВОПРОСА К КАЖДОМУ"};
 // собираем сами, чтобы не ломать порядок блоков

   if(b.kind!=="hotspot"&&b.kind!=="grid2")return null;
   const a=e[bi]||{};
   return `<div class="examblock" data-exslot="${bi}">
     <div class="examtop"><span class="examnum">${bi+1}</span><span class="examkind">${b.lab||lab[b.kind]}</span></div>

     ${b.dhint?`<div class="matchhint">${esc(b.dhint)}</div>`:""}
     ${b.kind==="hotspot"?hotspotBody(b,bi,a):grid2Body(b,bi,a)}</div>`;
 });
 // базовая отрисовка для остальных типов, затем подмена заглушек
 const stub=T.blocks.map((b,bi)=>inner[bi]?{kind:"__stub",q:"",bi:bi}:b);
 let html=_examBodyBase({...T,blocks:stub},d);

 return html;
};
reviewBlocks=function(blocks,a,head){

   </div></div>`;

function strikeBody(b,bi,a){

exReady=function(b,a){

   return b.items.every((x,i)=>(ch[i]||[]).filter(v=>v!==undefined).length===b.slots.length);}

 return _exReady5(b,a);

exScore=function(b,a){
 a=a||{};
 if(b.kind==="chain"){const ch=a.ch||{};let s=0,t=0;

/* Разбивку на пары делает учитель и кладёт её в состояние урока:
   у ученика нет списка класса, а пара должна быть у всех одна. */
function pairMap(){return (V.state&&V.state.pairsMap)||null;}
function pairsOf(list){
 const a=(list||[]).slice().sort((x,y)=>(x.joined||0)-(y.joined||0)||String(x.id).localeCompare(String(y.id)));
 const out=[];
 for(let i=0;i<a.length;i+=2){
   if(i+1<a.length)out.push([a[i],a[i+1]]);
   else if(out.length)out[out.length-1].push(a[i]);
   else out.push([a[i]]);
 }
 return out;
}
function buildPairMap(list){
 return pairsOf(list).map(g=>g.map(s=>({id:s.id,name:s.name})));
}
/* Класс меняется по ходу урока: кто-то входит позже, кого-то убрали.
   Учитель дособирает разбивку, чтобы никто не остался без пары. */
function reconcilePairs(list){
 const map=pairMap(); if(!map)return null;
 const alive=new Set(list.map(s=>s.id));
 let groups=map.map(g=>g.filter(x=>alive.has(x.id))).filter(g=>g.length);
 // опоздавшие — в самую маленькую группу
 const seen=new Set(groups.flat().map(x=>x.id));
 const late=list.filter(s=>!seen.has(s.id));
 late.forEach(s=>{
   const rec={id:s.id,name:s.name};
   if(!groups.length){groups.push([rec]);return;}
   const small=groups.reduce((a,b)=>b.length<a.length?b:a);
   if(small.length<2)small.push(rec); else groups.push([rec]);
 });
 // одиночки склеиваем с самой маленькой парой — получится тройка
 for(let i=groups.length-1;i>=0;i--){
   if(groups[i].length===1&&groups.length>1){
     const solo=groups.splice(i,1)[0];
     const small=groups.reduce((a,b)=>b.length<a.length?b:a);
     small.push(solo[0]);
   }
 }
 const same=JSON.stringify(groups)===JSON.stringify(map);
 return same?null:groups;
}
function myPair(){
 const m=pairMap();
 if(m)return m.find(g=>g.some(s=>s.id===V.sid))||null;
 return pairsOf(V.students||[]).find(p=>p.some(s=>s.id===V.sid))||null;
}
function pairAnswer(s,stage){const p=s.pair||{};return p[stage];}
function pairStats(stage){
 const list=V.students||[];
 const m=pairMap();
 const ps=m?m.map(g=>g.map(x=>list.find(s=>s.id===x.id)||x)):pairsOf(list);
 const P=LESSON.stages[stage].pairs;
 let answered=0,total=0,same=0,right=0;
 ps.forEach(g=>{
   total++;
   const vals=g.map(s=>pairAnswer(s,stage)).filter(v=>v!==undefined);
   if(vals.length===g.length)answered++;
   if(vals.length===g.length&&vals.every(v=>v===vals[0])){
     same++; if(vals[0]===P.right)right++;
   }
 });
 return {groups:ps,answered,total,same,right};
}

/* Копирование в буфер обмена. Современный путь — navigator.clipboard,
   запасной — скрытое поле и execCommand: он работает и там, где
   clipboard API закрыт (файл с диска, старый браузер, iOS). */
async function copyToClipboard(text){
 try{
   if(navigator.clipboard&&window.isSecureContext){
     await navigator.clipboard.writeText(text);
     return true;
   }
 }catch(e){}
 try{
   const ta=document.createElement("textarea");
   ta.value=text;
   ta.setAttribute("readonly","");
   ta.style.cssText="position:fixed;top:-1000px;left:0;opacity:0";
   document.body.appendChild(ta);
   if(/ipad|iphone|ipod/i.test(navigator.userAgent||"")){
     const r=document.createRange();
     r.selectNodeContents(ta);
     const sel=window.getSelection();
     sel.removeAllRanges(); sel.addRange(r);
     ta.setSelectionRange(0,text.length);
   }else{
     ta.select();
   }
   const ok=document.execCommand("copy");
   document.body.removeChild(ta);
   return !!ok;
 }catch(e){ return false; }
}

/* 1–3 класс — «детский» режим карточки. Берём из урока, если задано явно,
   иначе по номеру класса в подписи урока. */
const KIDMODE = (typeof LESSON.kid !== "undefined")
  ? !!LESSON.kid
  : /^[123]\s*класс/.test(String(LESSON.meta || ""));

const DIGITWORD = ["ноль","один","два","три","четыре","пять","шесть","семь","восемь","девять"];
/* Читаем значение вслух по знакам: ребёнок путает русскую А с латинской,
   тройку с буквой З, а дефис вообще не называет. Длинные значения
   не озвучиваем — там строчка вышла бы длиннее самого логина. */
function spellOut(v){
 const s = String(v == null ? "" : v);
 if(!s || s.length > 10) return "";
 return s.split("").map(ch=>{
   if(ch >= "0" && ch <= "9") return DIGITWORD[+ch];
   if(ch === "-") return "минус";
   if(/[А-ЯЁ]/.test(ch)) return esc(ch) + " <b>русская</b>";
   if(/[а-яё]/.test(ch)) return esc(ch) + " <b>русская маленькая</b>";
   if(/[A-Z]/.test(ch))  return esc(ch) + " английская";
   if(/[a-z]/.test(ch))  return esc(ch) + " английская маленькая";
   return esc(ch);
 }).join(" · ");
}
function readRow(v){
 const t = spellOut(v);
 return t ? `<div class="aread">ЧИТАЙ ТАК: ${t}</div>` : "";
}

const _exReady24=exReady, _exScore24=exScore, _examBody24=examBody, _reviewBlocks24=reviewBlocks;

   const need=b.need||b.cards.filter(c=>c.bad).length;

exScore=function(b,a){
 a=a||{};

   b.fields.forEach((f,i)=>{if(!!p[i]===!!f.priv)s++;});return{s,t:b.fields.length};}

 return _exScore24(b,a);
};

   const a=e[bi]||{};

 });

 inner.forEach((h,bi)=>{if(h)html=html.replace("<!--slot"+bi+"-->",h);});

commitStage=async function(next){
 const prev=V.state||{};
 const keep=(prev.stage===next.stage && prev.phase!=="task" && next.phase==="task")
   ? {set:(V.deck||{}).set||"theory", i:(V.deck||{}).i||0} : null;
 const ok=await _commitStage26(next);
 if(ok&&keep){
   const d=DECK[next.stage]||{};
   // если своих слайдов у задания нет, оставляем тот, что был на доске
   if(!(d.task&&d.task.length)){
     const list=(d[keep.set]&&d[keep.set].length)?d[keep.set]:(d.theory||[]);
     V.deck={set:keep.set,i:Math.min(keep.i,Math.max(0,list.length-1)),zoom:false};
     render();
   }
 }
 return ok;
};

submitTask=async function(){
 if(sixSending||V.screen!=='student'||V.state.phase!=='task'||!taskReady()||V.me.stages[V.state.stage])return;
 sixSending=true;const button=document.getElementById('submit');if(button){button.disabled=true;button.textContent='Проверяем…';}
 clearTimeout(progressTimer);await progressWrite;
 try{
  const stage=V.state.stage,latestState=await S.get(kState(V.code));
  if(!latestState||latestState.stage!==stage||latestState.phase!=='task'){toast('Этап изменился или нет связи. Попытка не потрачена.');return;}
  const fresh=await S.get(kStu(V.code,V.sid));if(!fresh||syncError){toast('Нет связи. Попытка не потрачена.');return;}
  if(fresh.stages&&fresh.stages[stage]){V.me=fresh;V.draft={};return;}
  const old=(fresh.attempts||{})[stage]||{used:0,bestRaw:0},s=LESSON.stages[stage],r=scoreTask();
  if(old.used>=3){toast('Все попытки этой станции уже использованы.');V.me=fresh;return;}
  const used=old.used+1,perfect=r.score===r.total,best=Math.max(old.bestRaw||0,r.score),next=JSON.parse(JSON.stringify(fresh));
  next.attempts=next.attempts||{};const wrong=s.task.blocks.map((b,i)=>{const rr=exScore(b,(V.draft.ex||{})[i]);return rr.s<rr.t?i+1:null;}).filter(Boolean);
  next.attempts[stage]={used,bestRaw:best,total:r.total,hint:s.retryHints[Math.min(used-1,1)],wrong:wrong.length?'Посмотри ещё раз: задание '+wrong.join(', ')+'.':'',at:Date.now()};
  const done=perfect||used===3;
  if(done){next.stages=next.stages||{};next.stages[stage]={score:Math.round(best/r.total*10),total:10,rawScore:r.score,rawTotal:r.total,attempts:used,at:Date.now(),conf:'sure',answers:JSON.parse(JSON.stringify(V.draft))};next.active=false;next.progress={stage,percent:100};if(V.draft.mood)next.mood=V.draft.mood;}
  if(!await S.set(kStu(V.code,V.sid),next)){toast('Не удалось сохранить ответ. Попытка не потрачена.');return;}
  V.me=next;if(done){V.draft={};V.bdraft={};V.bonusOpen=false;V.justSubmitted=true;}rememberSession();
 }finally{sixSending=false;render();}
};

 sixSending=true;const send=document.getElementById('bsend');if(send){send.disabled=true;send.textContent='Сохраняем баллы…';}clearTimeout(progressTimer);await progressWrite;
 try{
  const fresh=await S.get(kStu(V.code,V.sid));if(!fresh||syncError){toast('Нет связи. Ответ не отправлен.');return;}if((fresh.bonus||{})[stage]){V.me=fresh;V.bonusOpen=false;return;}
  const answers=JSON.parse(JSON.stringify((exDraft().ex)||{}));let raw=0,total=0;bn.blocks.forEach((b,i)=>{const r=exScore(b,answers[i]);raw+=r.s;total+=r.t;});

 }finally{sixSending=false;render();}

const IAKINDS=['pack','senseslab','safecode','radio','mail','ticket'];
const iaReadyBase=exReady,iaScoreBase=exScore;
exReady=function(b,a){if(!IAKINDS.includes(b.kind))return iaReadyBase(b,a);a=a||{};if(b.kind==='pack')return (a.packed||[]).length===b.need;if(b.kind==='senseslab')return b.items.every((x,i)=>Number.isInteger((a.answers||{})[i]));if(b.kind==='safecode')return b.slots.every((x,i)=>(a.code||{})[i]!==undefined);if(b.kind==='radio')return b.channels.every((x,i)=>Number.isInteger((a.signals||{})[i]));if(b.kind==='mail')return (a.path||[]).length===b.steps.length;if(b.kind==='ticket')return b.steps.every((x,i)=>Number.isInteger((a.stamps||{})[i]));return false;};
exScore=function(b,a){if(!IAKINDS.includes(b.kind))return iaScoreBase(b,a);a=a||{};let s=0,t=0;if(b.kind==='pack'){t=b.cards.length;b.cards.forEach((x,i)=>{if((a.packed||[]).includes(i)===!!x.bad)s++;});}if(b.kind==='senseslab'){t=b.items.length;b.items.forEach((x,i)=>{if((a.answers||{})[i]===x.ok)s++;});}if(b.kind==='safecode'){t=b.slots.length;b.slots.forEach((x,i)=>{if((a.code||{})[i]===x.ok)s++;});}if(b.kind==='radio'){t=b.channels.length;b.channels.forEach((x,i)=>{if((a.signals||{})[i]===x.ok)s++;});}if(b.kind==='mail'){t=b.steps.length;b.steps.forEach((x,i)=>{if((a.path||[])[i]===i)s++;});}if(b.kind==='ticket'){t=b.steps.length;b.steps.forEach((x,i)=>{if((a.stamps||{})[i]===x.ok)s++;});}return{s,t};};

const iaExamBase=examBody;

progressPercent=function(){const T=LESSON.stages[V.state.stage].task;if(!T.blocks||!T.blocks.some(b=>IAKINDS.includes(b.kind)))return iaProgressBase();const e=V.draft.ex||{};let total=0,filled=0;T.blocks.forEach((b,i)=>{const a=e[i]||{};if(b.kind==='pack'){total+=b.need;filled+=Math.min((a.packed||[]).length,b.need);}else if(b.kind==='senseslab'){total+=b.items.length;filled+=Object.keys(a.answers||{}).length;}else if(b.kind==='safecode'){total+=b.slots.length;filled+=Object.keys(a.code||{}).length;}else if(b.kind==='radio'){total+=b.channels.length;filled+=Object.keys(a.signals||{}).length;}else if(b.kind==='mail'){total+=b.steps.length;filled+=(a.path||[]).length;}else if(b.kind==='ticket'){total+=b.steps.length;filled+=Object.keys(a.stamps||{}).length;}else{total++;if(exReady(b,a))filled++;}});if(T.moods){total++;if(V.draft.mood)filled++;}return Math.min(100,Math.round(filled/Math.max(total,1)*100));};

/* Shuffle presentation only. Original answer IDs remain the scoring IDs. */
function orderedEntries(values,group,options={}){
 const shared=!!options.shared,actor=shared?'class':(V.sid||(V.me&&V.me.id)||'preview');
 const context=[V.code||'preview',actor,(V.state&&V.state.stage)||0,shared?'poll':(V.bonusMode?'bonus':'main'),group].join('|');
 let seed=2166136261;for(const c of context){seed^=c.charCodeAt(0);seed=Math.imul(seed,16777619);}seed>>>=0;
 const random=()=>{seed=(seed+0x6D2B79F5)>>>0;let x=seed;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return((x^(x>>>14))>>>0)/4294967296;};
 const count=values.length;let ids=values.map((_,i)=>i);
 for(let tries=0;tries<48;tries++){
  ids=values.map((_,i)=>i);for(let i=count-1;i>0;i--){const j=Math.floor(random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const unchanged=count>2&&ids.every((id,i)=>id===i);
  let clumped=false;if(options.spread){const positions=ids.map((id,i)=>options.spread(values[id])?i:-1).filter(i=>i>=0);clumped=positions.length>1&&positions.length<count-1&&positions.at(-1)-positions[0]+1===positions.length;}
  if(!unchanged&&!clumped)break;
 }
 return ids.map((index,position)=>({value:values[index],index,position}));
}

reviewBlocks=function(blocks,answers,head){if(!blocks.some(b=>G4KINDS.includes(b.kind)))return g4review(blocks,answers,head);return blocks.map((b,i)=>{if(!G4KINDS.includes(b.kind))return g4review([b],{0:(answers||{})[i]},'');const a=(answers||{})[i]||{},r=exScore(b,a);let text='';if(b.kind==='medialab')text=b.items.map(x=>x.t+' — '+x.ok).join('; ');if(b.kind==='cipherlab')text='Обратный сдвиг −1. Ответ: КЛАСС.';if(b.kind==='sourcecheck')text='Магазин наград · 2023 год. '+b.claims.filter(x=>x.ok).map(x=>x.t).join('. ');if(b.kind==='redact')text='Закрываем: '+b.fields.filter(x=>x.priv).map(x=>x.t).join(', ')+'.';if(b.kind==='audittimeline')text=b.events.map(x=>x.time+' — '+x.t).join(' → ');if(b.kind==='linklab')text='На шестом месте вместо буквы l стоит цифра 1. Правильный учебный адрес: '+b.official;return `<div class="card reviewcard"><h3>${esc(b.q)}</h3><div class="reviewrow ${r.s===r.t?'':'bad'}"><b>${r.s===r.t?'✓ Верно':'Разбор'} · ${r.s} из ${r.t}</b><p>${esc(text)}</p></div></div>`;}).join('');};
const g4bind=bindExtra;
bindExtra=function(){g4bind();const cls=document.getElementById('g4class');if(cls)cls.oninput=()=>V.form.rclass=cls.value;el.querySelectorAll('[data-g4]').forEach(n=>n.onclick=()=>{const [bi,action,j,label]=n.dataset.g4.split(':'),d=exDraft();d.ex=d.ex||{};const a=d.ex[bi]=d.ex[bi]||{},v=+j;if(action==='type'){a.types=a.types||{};a.types[v]=label;}else if(['claims','hidden'].includes(action)){a[action]=a[action]||[];a[action]=a[action].includes(v)?a[action].filter(x=>x!==v):[...a[action],v];}else if(action==='order'){a.order=a.order||[];if(!a.order.includes(v))a.order.push(v);}else if(action==='remove')a.order=(a.order||[]).filter((_,i)=>i!==v);else a[action]=v;render();});el.querySelectorAll('[data-g4audio]').forEach(n=>n.onclick=()=>{const [i,j]=n.dataset.g4audio.split(':');iaSpeak(curBlocks()[+i].items[+j].body);});};
startLine=function(){return 'Шесть улик, три попытки с подсказками и дополнительные задания. До 90 баллов. Дети входят по коду, общий рейтинг обновляется на доске.';};
vLanding=function(){return `<div class="wrap"><div class="hd">${logo()}<div class="sp"></div><div class="pill">4 класс · Игра-расследование</div></div><section class="g4hero card"><div><div class="crumb">МАТЕРИАЛЫ ДЕЛА № 04</div><h1>Дело о<br>чужом входе</h1><p>${esc(G4_CASE.intro)}</p><div class="g4choices"><button class="btn" data-go="join">Начать расследование ${I.arr}</button><button class="btn ghost" data-go="teacher">Я учитель</button></div><p>6 улик · 3 попытки · бонусы · живой рейтинг</p></div><div class="g4heroart">${g4img('g4messages')}<img src="${BEAR}" alt="Кибермишка"><img src="${OWL}" alt="Киберсова"></div></section><div class="g4tiles">${LESSON.stages.map((s,i)=>`<div class="card">${g4img(s.art)}<b>${i+1}. ${esc(s.name)}</b><small>${esc(s.short)}</small></div>`).join('')}</div></div>`;};
vJoin=function(){return `<div class="wrap"><div class="hd">${logo()}<div class="pill">4 класс</div></div><div class="joinwrap"><div class="card"><button class="back" data-go="landing">${I.back} Назад</button><div class="crumb">ВХОД В РАССЛЕДОВАНИЕ</div><h2>Присоединяйся к делу</h2><p>Возьми код с доски. Укажи имя и первую букву фамилии, чтобы учитель узнал тебя.</p><div class="field"><label for="g4class">Класс</label><input class="inp" id="g4class" maxlength="30" value="${esc(V.form.rclass||'4 класс')}"></div><div class="field"><label for="name">Имя и первая буква фамилии</label><input class="inp" id="name" maxlength="30" value="${esc(V.form.name||'')}"></div><div class="field"><label for="code">Код с доски</label><input class="inp code" id="code" inputmode="numeric" maxlength="4" value="${esc(V.form.code||'')}"></div><div class="err">${esc(V.err)}</div><button class="btn" id="enter">Открыть материалы дела</button></div><div class="g4joinart">${g4img('g4scanner')}<p>Одинаковое имя и класс позволяют продолжить игру после обновления страницы.</p></div></div></div>`;};
const g4enter=enterRoom;
enterRoom=async function(){V.form.name=(V.form.name||'').trim();V.form.rclass=(V.form.rclass||'4 класс').trim();if(V.form.name.length<2||!V.form.rclass){V.err='Укажи свой класс и имя.';render();return;}await g4enter();};
vSent=function(){const st=V.state.stage,s=LESSON.stages[st],rec=V.me.stages[st],done=myDone().size;return `<div class="wrap sixstudent"><div class="hd">${logo()}${stepper(st,myDone())}<div class="pill">${esc(V.me.name)}</div></div><section class="card sixsent">${g4img(s.art)}<div><div class="crumb">${done===6?'РАССЛЕДОВАНИЕ ЗАВЕРШЕНО':'УЛИКА ПРОВЕРЕНА'}</div><h1>${done===6?'Способ входа установлен':'Материал добавлен в дело'}</h1><p>${esc(G4_CASE.evidence[st])}</p><b>Лучший результат: ${rec.score} из 10 · попыток ${rec.attempts} из 3</b><p>Всего: ${pointsOf(V.me).total} баллов</p></div></section>${bonusCard(st)}<details class="sixreview"><summary>Разбор заданий</summary>${reviewStage(st,rec)}</details><section class="card g4evidence"><h2>Собранные факты</h2>${[...myDone()].sort((a,b)=>a-b).map(i=>`<p><b>${+i+1}.</b> ${esc(G4_CASE.evidence[i])}</p>`).join('')}<p>Следующую улику открывает учитель.</p></section></div>`;};
const g4rank=vSixRank;vSixRank=function(){return g4rank().replace('Таблица путешественников','Рейтинг следователей').replace('Ура! Рюкзак собран!','Дело расследовано!').replace('задания Совы','бонусные задания');};
const g4task=vTask;vTask=function(){return g4task().replace('СТАНЦИЯ','УЛИКА').replace('на станции','для улики');};
progressPercent=function(){const T=LESSON.stages[V.state.stage].task;let n=T.blocks.length+(T.moods?1:0),got=T.blocks.filter((b,i)=>exReady(b,(V.draft.ex||{})[i])).length+(T.moods&&V.draft.mood?1:0);return Math.round(got/n*100);};

render();restoreSession();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Дело о чужом входе · 4 класс</title>
<meta name="description" content="Четыре станции перед каникулами: цифровые устройства, органы чувств и информация. Игра для 1 класса.">
<style>

:root{
  --bg:#f4f7fd; --grid:#e6ecfa; --card:#fff;
  --ink:#12295f; --navy:#1b3a86; --blue:#1f4fd8; --blue-d:#1a41b4;
  --blue-l:#e9f0ff; --blue-l2:#f5f8ff; --muted:#7488a8; --line:#e0e8f7;
  --orange:#ef6f45; --orange-l:#fff1ec; --green:#16a86e; --green-l:#e6f8f0;
  --sh:0 10px 40px rgba(24,58,130,.08); --sh-s:0 2px 10px rgba(24,58,130,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Manrope','Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 130px}
.hd{display:flex;align-items:center;gap:20px;padding:4px 0 26px}
.logo{display:flex;align-items:center;gap:11px;flex:none}
.logo .mark{border-radius:13px;background:linear-gradient(150deg,#28468f,#111f47);padding:10px 16px;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(31,79,216,.28)}
.logo .mark img{display:block;height:18px;width:auto}
.logo .sub{font-size:10.5px;letter-spacing:.05em;color:var(--muted);font-weight:700;line-height:1.25;max-width:10ch}
@media(max-width:600px){.logo .sub{display:none}.logo .mark{padding:8px 13px}.logo .mark img{height:15px}}
.pill{background:#fff;border-radius:999px;padding:10px 19px;font-weight:700;font-size:13.5px;box-shadow:var(--sh-s);flex:none;white-space:nowrap}
.sp{flex:1}
/* stepper */
.stepper{display:flex;align-items:center;flex:1;min-width:0;padding-top:4px}
.stepline{height:2px;background:var(--line);flex:1;min-width:6px;margin-top:-19px}
.stp{display:grid;place-items:center;gap:5px;padding:0 5px;min-width:72px}
.stp .n{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#fff;
  color:var(--muted);border:2px solid var(--line)}
.stp .lb{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.stp.on .n{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(31,79,216,.35)}
.stp.on .lb{color:var(--blue)}
.mtch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:640px){.mtch{grid-template-columns:1fr}}
.mcol{display:flex;flex-direction:column;gap:8px}
.mch{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;
 border:1.6px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:14.5px;line-height:1.35;transition:.14s}
.mch:hover{border-color:#b9c9ef}
.mch.sel{border-color:var(--blue);background:#eef3ff;box-shadow:0 0 0 3px rgba(60,110,240,.13)}
.mch.tied{border-color:var(--green);background:var(--green-l)}
.mch .lk{margin-left:auto;flex:none;width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
 background:var(--green);color:#fff;font-size:11px;font-weight:800}
.mch.gone{opacity:.42}
.mcolh{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:2px}
.ordq{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ordit{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:14px;border:1.6px solid var(--line);
 background:#fff;cursor:pointer;font:inherit;font-size:14.5px;text-align:left;transition:.14s}
.ordit:hover{border-color:#b9c9ef}
.ordit.on{border-color:var(--blue);background:#eef3ff}
.ordit .on-n{flex:none;width:24px;height:24px;border-radius:9px;background:var(--blue);color:#fff;
 display:grid;place-items:center;font-size:12.5px;font-weight:800}
.ordit .off-n{flex:none;width:24px;height:24px;border-radius:9px;border:1.6px dashed var(--line);color:var(--muted);
 display:grid;place-items:center;font-size:12.5px;font-weight:800}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
.revh{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
.revr{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:13px;margin-bottom:7px;
 background:var(--green-l);border:1.4px solid #bceada;font-size:14px;line-height:1.4}
.revr.bad{background:#fff1ef;border-color:#f6c9c1}
.revr .m{flex:none;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;margin-top:1px}
.revr .m.y{background:var(--green)}.revr .m.n{background:#e4694f}
.revr b{font-weight:750}
.revr .cor{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.moodwall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.mw{border:1.6px solid var(--line);border-radius:18px;padding:14px;text-align:center;background:#fff}
.mw img{width:74px;height:74px;object-fit:contain;margin-bottom:6px}
.mw b{display:block;font-size:30px;line-height:1;letter-spacing:-.03em}
.mw span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.mw .prog{height:7px;border-radius:7px;background:#eef1f7;margin-top:9px;overflow:hidden}
.mw .prog i{display:block;height:100%;background:var(--blue);border-radius:7px;transition:.5s}
.stp.done .n{background:var(--green);border-color:var(--green);color:#fff}
.stp.done .lb{color:var(--green)}
/* landing */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;min-height:66vh}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--blue);font-weight:700;font-size:12.5px;letter-spacing:.15em;margin-bottom:20px}
h1.big{font-size:clamp(38px,5.4vw,70px);line-height:1;letter-spacing:-.03em;margin:0 0 20px;font-weight:800}
h1.big .l2{color:var(--blue)}
.lede{font-size:17px;line-height:1.6;color:#43598a;max-width:38ch;margin:0 0 28px}
.roles2{display:flex;gap:14px;flex-wrap:wrap}
.rolebtn{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:16px 22px;min-width:252px;
  box-shadow:var(--sh);transition:transform .16s,box-shadow .16s;text-align:left}
.rolebtn:hover{transform:translateY(-2px)}
.rolebtn .ic{width:42px;height:42px;border-radius:13px;background:var(--blue-l);display:grid;place-items:center;flex:none;color:var(--blue)}
.rolebtn b{display:block;font-size:16px}.rolebtn span{font-size:12.5px;color:var(--muted);font-weight:500}
.rolebtn.primary{background:var(--blue);color:#fff}.rolebtn.primary .ic{background:rgba(255,255,255,.16);color:#fff}
.rolebtn.primary span{color:#c3d5ff}
.arr{margin-left:auto;opacity:.55}
.masc{position:relative;display:grid;place-items:center;min-height:370px}
.blob{position:absolute;width:min(105%,520px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#e2ecff 0%,#eef4ff 55%,rgba(238,244,255,0) 72%)}
.mrow{display:flex;align-items:flex-end;gap:6px;position:relative}
.masc img{position:relative;filter:drop-shadow(0 18px 30px rgba(20,50,120,.14))}
.m-bear{width:min(46%,268px)}.m-owl{width:min(34%,202px);margin-bottom:6px}
.alert{position:absolute;top:4%;left:0;background:#fff;border-radius:14px;padding:12px 16px;box-shadow:var(--sh);z-index:2}
.alert .t{color:var(--orange);font-size:10.5px;font-weight:800;letter-spacing:.13em;margin-bottom:3px}
.alert .d{font-weight:700;font-size:14px}.alert .dot{position:absolute;top:12px;right:13px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:600;padding-top:24px;gap:16px;flex-wrap:wrap}
/* cards */
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:26px}
h2.h{font-size:clamp(26px,3.3vw,40px);letter-spacing:-.025em;margin:0 0 6px;font-weight:800}
.crumb{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.14em;margin:0 0 8px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:16px}
.back:hover{color:var(--blue)}
/* join */
.joinwrap{display:grid;grid-template-columns:1fr .8fr;gap:36px;align-items:center;min-height:64vh}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:7px}
.inp{width:100%;font-size:16px;font-weight:600;padding:15px 17px;border-radius:14px;border:2px solid var(--line);
  background:#fbfcff;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--blue);background:#fff}
.inp.code{font-size:26px;letter-spacing:.42em;font-weight:800}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.rcard{display:flex;align-items:center;gap:11px;background:#fbfcff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;transition:.14s}
.rcard:hover{border-color:#c3d6fb}
.rcard.on{border-color:var(--blue);background:#fff;box-shadow:0 6px 18px rgba(31,79,216,.15)}
.rcard .ic{color:var(--blue);flex:none}
.rcard b{display:block;font-size:14.5px}.rcard span{font-size:12px;color:var(--muted);font-weight:600}
.dossier{background:linear-gradient(150deg,#2453d6,#1a3ea8);color:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 16px 40px rgba(26,62,168,.3);
  transform:rotate(-1.6deg);margin-bottom:-18px;position:relative;z-index:2;max-width:330px;margin-left:auto}
.dossier .lab{font-size:10.5px;letter-spacing:.15em;font-weight:800;color:#a8c3ff;margin-bottom:8px}
.dossier b{font-size:21px;font-weight:800;line-height:1.2;display:block;margin-bottom:12px;letter-spacing:-.01em}
.dossier ul{margin:0;padding-left:16px;font-size:13.5px;line-height:1.85;color:#dbe6ff}
.err{color:var(--orange);font-weight:700;font-size:13.5px;min-height:19px;margin:2px 0 8px}
/* пропуск / ожидание */
.waitgrid{display:grid;grid-template-columns:1.02fr .98fr;gap:30px;align-items:center;min-height:62vh}
.pass{background:linear-gradient(100deg,#2453d6,#3f74ff);color:#fff;border-radius:18px;padding:18px 22px;box-shadow:0 14px 34px rgba(31,79,216,.28);
  display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;max-width:520px}
.pass .lab{font-size:10.5px;letter-spacing:.15em;font-weight:800;color:#bad0ff;margin-bottom:4px}
.pass .nm{font-size:23px;font-weight:800;line-height:1}
.pass .rl{margin-left:auto;font-size:12.5px;color:#cfdeff;font-weight:600}
.waitline{display:flex;align-items:center;gap:9px;color:var(--blue);font-weight:700;font-size:14.5px;margin:16px 0 0}
.waitline svg{flex:none}
.chip-s{background:#fff;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;box-shadow:var(--sh-s);color:var(--navy)}
.tip{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:var(--sh-s);display:flex;gap:11px;align-items:flex-start;
  font-size:14px;line-height:1.5;color:#3d557f;max-width:520px;margin-top:18px}
.mcap{position:absolute;background:#fff;border-radius:14px;padding:11px 15px;box-shadow:var(--sh);font-size:12.5px;line-height:1.4;width:186px;z-index:3}
.mcap b{display:block;font-size:10.5px;letter-spacing:.11em;color:var(--blue);margin-bottom:4px}
/* mission shell */
.mhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.mnum{width:60px;height:60px;border-radius:18px;background:linear-gradient(150deg,#f89268,#ec6039);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:21px;flex:none;box-shadow:0 8px 20px rgba(236,96,57,.3)}
.mhead .eb{color:var(--blue);font-weight:700;font-size:11.5px;letter-spacing:.15em;margin-bottom:4px}
.mhead h2{font-size:clamp(24px,3.2vw,36px);margin:0;letter-spacing:-.025em;font-weight:800}
.mbar{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.mbar p{margin:0;color:#48608f;font-size:14.5px;line-height:1.55;max-width:74ch}
.counter{margin-left:auto;background:var(--blue-l);color:var(--navy);border-radius:999px;padding:9px 16px;font-weight:800;font-size:12.5px;
  white-space:nowrap;flex:none}
.counter.full{background:var(--green-l);color:var(--green)}
.hint{background:linear-gradient(94deg,#eef4ff,#f7faff);border-radius:14px;padding:14px 18px;display:flex;gap:11px;align-items:flex-start;
  font-size:14px;line-height:1.5;color:#3f5580;margin-top:20px}
.hint .hi{color:var(--orange);flex:none;margin-top:1px}
.fab{position:fixed;right:28px;bottom:26px;z-index:30}
.btn{background:var(--blue);color:#fff;border-radius:15px;padding:15px 26px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;
  gap:10px;box-shadow:0 10px 26px rgba(31,79,216,.32);transition:.16s}
.btn:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn:disabled{background:#9db4e8;box-shadow:none;cursor:not-allowed;transform:none;color:#eaf0ff}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh-s)}
.btn.ghost:hover{background:#f6f9ff}
.btn.wide{width:100%;justify-content:center}
.btn.ready{animation:pl 1.7s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 10px 26px rgba(31,79,216,.3)}50%{box-shadow:0 10px 34px rgba(31,79,216,.6)}}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
/* task: cases */
.cases{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.case{background:#fbfcff;border:2px solid var(--line);border-radius:17px;padding:13px;text-align:left;transition:.14s;position:relative}
.case:hover{border-color:#c3d6fb}
.case.on{border-color:var(--orange);background:#fff;box-shadow:0 8px 22px rgba(236,96,57,.18)}
.case .cn{width:29px;height:29px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-bottom:9px}
.case.on .cn{background:var(--orange)}
.case .ct{font-size:13.5px;font-weight:700;line-height:1.35;min-height:56px}
.case .cim{margin-top:10px;border-radius:12px;aspect-ratio:1;display:grid;place-items:center;font-size:44px;
  background:linear-gradient(160deg,#eaf1ff,#dfe9fd)}
.case.on .cim{background:linear-gradient(160deg,#ffeee8,#ffe0d5)}
/* task: sort */
.sortgrid{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr;gap:12px}
.sortcards{grid-column:1/4;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{background:#fbfcff;border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;place-items:center;gap:8px;transition:.14s}
.scard:hover{border-color:#c3d6fb}
.scard.sel{border-color:var(--blue);box-shadow:0 8px 22px rgba(31,79,216,.18);background:#fff}
.scard.placed{opacity:.32;pointer-events:none}
.scard .em{font-size:40px}
.scard b{font-size:13.5px;font-weight:700;text-align:center}
.zones{grid-column:4;display:grid;gap:12px;align-content:start}
.zone{border:2px dashed #b9cdf5;border-radius:16px;padding:18px 14px;text-align:center;background:#f4f8ff;min-height:132px;transition:.14s}
.zone.warm{border-color:#f6c3ac;background:#fff7f3}
.zone.hot{border-style:solid;box-shadow:0 8px 22px rgba(31,79,216,.15)}
.zone .zl{font-weight:800;font-size:13px;letter-spacing:.09em;margin:6px 0 3px;color:var(--blue)}
.zone.warm .zl{color:var(--orange)}
.zone .zd{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.4}
.zbag{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.zbag button{background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;box-shadow:var(--sh-s)}
/* task: contracts */
.contracts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.contract{background:#fbfcff;border:2px solid var(--line);border-radius:18px;padding:18px}
.contract .cl{color:var(--orange);font-size:10.5px;font-weight:800;letter-spacing:.14em;margin-bottom:7px}
.contract h4{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.contract p{margin:0 0 12px;font-size:13.5px;color:#4d6b96;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tags span{background:var(--blue-l);color:var(--navy);border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700}
.dev{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 13px;
  width:100%;text-align:left;font-size:13.5px;font-weight:700;margin-bottom:8px;transition:.14s;color:var(--navy)}
.dev:hover{border-color:#c3d6fb}
.dev.on{border-color:var(--blue);background:var(--blue-l);box-shadow:0 6px 16px rgba(31,79,216,.14)}
.dev .di{color:var(--blue);flex:none}
/* task: yesno + final */
.qrow{background:#fbfcff;border:2px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.qrow .qn{width:28px;height:28px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.qrow .qt{font-weight:700;font-size:14.5px;line-height:1.4}
.yn{margin-left:auto;display:flex;gap:8px;flex:none}
.yn button{padding:10px 20px;border-radius:12px;background:#eef3fd;font-weight:800;font-size:13.5px;border:2px solid transparent;color:var(--navy)}
.yn button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.qblock{margin-bottom:18px}
.qblock .qq{font-weight:800;font-size:16px;margin-bottom:10px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;background:#fbfcff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;
  text-align:left;font-size:14.5px;font-weight:600;transition:.14s;width:100%;line-height:1.35}
.opt:hover{border-color:#c3d6fb}
.opt.on{background:#fff;border-color:var(--blue);box-shadow:0 6px 18px rgba(31,79,216,.15)}
.opt .box{width:23px;height:23px;border-radius:8px;border:2px solid #c6d5f0;flex:none;display:grid;place-items:center;background:#fff}
.opt.on .box{background:var(--blue);border-color:var(--blue)}
.moods{display:flex;gap:10px;flex-wrap:wrap}
.mood{background:#fbfcff;border:2px solid var(--line);border-radius:14px;font-weight:700;font-size:14px;display:flex;align-items:center}
.mood.on{border-color:var(--blue);background:#fff;box-shadow:0 6px 16px rgba(31,79,216,.15)}
.mood .e{font-size:21px}
/* sent */
.sent{text-align:center;max-width:540px;margin:0 auto}
.sent .ic{width:82px;height:82px;border-radius:26px;background:var(--green-l);display:grid;place-items:center;margin:0 auto 18px}
.sent h2{font-size:29px;margin:0 0 8px;letter-spacing:-.025em}
.sent p{color:var(--muted);font-size:15px;margin:0;line-height:1.55}
.scoreline{display:inline-flex;align-items:center;gap:10px;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:11px 21px;
  font-weight:800;font-size:15px;margin-top:18px}
.center{display:grid;place-items:center;min-height:66vh}
/* teacher */
.codebar{background:linear-gradient(100deg,#1f4fd8,#3f74ff);color:#fff;border-radius:22px;padding:20px 26px;display:flex;align-items:center;
  gap:26px;flex-wrap:wrap;box-shadow:0 12px 34px rgba(31,79,216,.28)}
.codebar .lab{font-size:11px;letter-spacing:.14em;font-weight:700;color:#c5d7ff;margin-bottom:2px}
.codebar .code{font-size:40px;font-weight:800;letter-spacing:.18em;line-height:1}

.case .cim img{width:100%;height:100%;object-fit:contain;border-radius:14px}

/* ===== 1 класс, игра перед каникулами: четыре станции на картинках ===== */
.mtch{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 60px;margin-top:12px;align-items:start}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.mlines path{fill:none;stroke-linecap:round}
.mlines .mline{stroke-width:5.5}
.mlines .mline.new{animation:mdraw .42s ease forwards}
@keyframes mdraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.mlines .mlive{stroke-width:5.5;stroke-dasharray:10 9;opacity:.8}
.mcol{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.mch{position:relative;width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:18px;
  border:2.5px solid var(--line);background:#fff;font-weight:700;font-size:17px;line-height:1.3;min-height:88px;
  box-shadow:var(--sh-s);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease,background .15s ease}
.mch .mic{flex:none;width:62px;height:62px;border-radius:17px;background:var(--blue-l2);border:1.5px solid var(--line);
  display:grid;place-items:center;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.mch .mic svg{width:46px;height:46px;display:block}
.mch .mtx{flex:1;min-width:0}
.mch .dot{position:absolute;top:50%;width:17px;height:17px;border-radius:50%;background:#fff;border:3.5px solid var(--line);
  transform:translateY(-50%);transition:background .2s ease,border-color .2s ease,transform .2s ease}
.mch[data-mside="t"] .dot{right:-9px}
.mch[data-mside="d"] .dot{left:-9px}
.mch:hover{border-color:#b9c9ef;transform:translateY(-1px)}
.mch:hover .mic{transform:scale(1.04)}
.mch.sel{border-color:var(--pc,var(--blue));background:#f7faff;transform:translateY(-2px);box-shadow:0 0 0 4px rgba(60,110,240,.14),var(--sh-s)}
.mch.sel .mic{background:#e9f0ff;border-color:var(--pc,var(--blue));transform:scale(1.07) rotate(-4deg)}
.mch.sel .dot{background:var(--pc,var(--blue));border-color:var(--pc,var(--blue));transform:translateY(-50%) scale(1.2)}
.mch.tied{border-color:var(--pc,var(--green))}
.mch.tied .mic{border-color:var(--pc,var(--green))}
.mch.tied .dot{background:var(--pc,var(--green));border-color:var(--pc,var(--green))}
.mch.over{border-color:var(--blue);background:#f2f6ff;transform:translateY(-2px) scale(1.01)}
.mch .lk{margin-left:auto;flex:none;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
  background:var(--pc,var(--blue));color:#fff;font-size:14px;font-weight:800;box-shadow:none}
.mch.pop{animation:mpop .42s ease}
@keyframes mpop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
.mch.pop .mic{animation:mpopi .42s ease}
@keyframes mpopi{0%{transform:scale(1)}45%{transform:scale(1.16) rotate(6deg)}100%{transform:scale(1)}}
.mch[data-mside="t"]{cursor:grab}
body.mdragging{cursor:grabbing;user-select:none}
body.mdragging .mch,body.mdragging .scard{cursor:grabbing}

/* иконки в вариантах ответа */
.opt .oic{flex:none;width:52px;height:52px;border-radius:15px;background:var(--blue-l2);border:1.5px solid var(--line);
  display:grid;place-items:center;transition:transform .18s ease,border-color .18s ease}
.opt .oic svg{width:38px;height:38px;display:block}
.opt.on .oic{border-color:var(--blue);transform:scale(1.05)}

/* иконки в разборе ответов */
.ricon{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#fff;border:1.4px solid var(--line);
  margin-right:9px;vertical-align:-10px}
.ricon svg{width:24px;height:24px;display:block}

/* сортировка: перетаскивание и миниатюры в корзине */
.scard{cursor:grab;position:relative}
.scard.dragging{opacity:.35}
.zone{transition:transform .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}
.zone.over{border-style:solid;border-color:var(--blue);background:#eaf1ff;transform:scale(1.02);box-shadow:0 10px 26px rgba(31,79,216,.2)}
.zone.warm.over{border-color:var(--orange);background:#fff1ea;box-shadow:0 10px 26px rgba(239,111,69,.2)}
.zbag{gap:8px}
.zbag button{display:flex;align-items:center;gap:7px;padding:6px 9px 6px 6px;border:1.6px solid var(--line);position:relative}
.zbag button img{width:34px;height:28px;object-fit:contain;display:block}
.zbag button .rm{width:19px;height:19px;border-radius:50%;background:#eef3fd;color:var(--muted);font-size:13px;line-height:17px;
  font-weight:800;text-align:center;flex:none}
.zbag button:hover .rm{background:#ffe1dc;color:#d84d39}
.zbag button.drop-in{animation:zdrop .38s ease}
@keyframes zdrop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.dragghost{position:fixed;z-index:9999;pointer-events:none;background:#fff;border:2.5px solid var(--blue);border-radius:16px;
  padding:8px 12px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--ink);
  box-shadow:0 14px 34px rgba(24,58,130,.28);transform:translate(-50%,-50%) rotate(-3deg)}
.dragghost img{width:46px;height:38px;object-fit:contain;display:block}

/* да / нет с иконками */
.yn button{display:inline-flex;align-items:center;gap:7px}
.yn button .ynic{width:20px;height:20px;display:grid;place-items:center}
.yn button .ynic svg{width:20px;height:20px;display:block}
.yn button.yes{color:var(--green)}
.yn button.no{color:var(--orange)}
.yn button.on.yes{background:var(--green);border-color:var(--green);color:#fff}
.yn button.on.no{background:var(--orange);border-color:var(--orange);color:#fff}

/* выбранная карточка-улика */
.case .cmark{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;
  display:grid;place-items:center;font-size:17px;font-weight:800;box-shadow:0 5px 14px rgba(239,111,69,.4);animation:mpop .4s ease}

@media(max-width:900px){.mtch{gap:10px 40px}.mch{font-size:15px;gap:10px;padding:10px 11px;min-height:74px}
  .mch .mic{width:52px;height:52px;border-radius:15px}.mch .mic svg{width:38px;height:38px}}
@media(max-width:620px){.mtch{grid-template-columns:1fr;gap:10px}.mlines{display:none}.mch .dot{display:none}
  .mch{min-height:66px}.mch .mic{width:46px;height:46px}.mch .mic svg{width:34px;height:34px}
  .opt .oic{width:44px;height:44px}.opt .oic svg{width:32px;height:32px}}

/* ===== занятие 2: иконки вместо фотографий ===== */
.taskpic{display:block;width:100%;max-width:520px;margin:12px auto 4px;border-radius:16px;border:1.5px solid var(--line)}
.case .cim.ico{background:var(--blue-l2);border:1.5px solid var(--line);display:grid;place-items:center}
.case .cim.ico svg{width:74%;height:74%;display:block}
.case.on .cim.ico{background:#fff1ec;border-color:#f6c3ac}
.case .cmark{font-size:16px}
.scard .sim.ico{width:100%;height:112px;display:grid;place-items:center}
.scard .sim.ico svg{width:88px;height:88px;display:block}
.zbag button .zic{display:grid;place-items:center;width:30px;height:30px;flex:none}
.zbag button .zic svg{width:28px;height:28px;display:block}
.dragghost .gic svg{width:46px;height:46px;display:block}
@media(max-width:720px){.scard .sim.ico{height:86px}.scard .sim.ico svg{width:70px;height:70px}}

/* ===== ЩИТ ===== */
.shieldbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px 22px}
.shwrap{position:relative;width:170px;height:190px}
.shwrap>svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 26px rgba(31,79,216,.28))}
.shsegs{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:6px}
.shsegs i{display:block;width:17px;height:38px;border-radius:5px;background:#cfe0fb;box-shadow:inset 0 0 0 1.5px #a9c6f3;transition:background .3s}
.shsegs i.lit{background:linear-gradient(180deg,#63e0ff,#2f8bff);box-shadow:0 0 12px rgba(60,170,255,.85),inset 0 0 0 1.5px #bfe9ff}
.shieldbox.go .shsegs i.new{animation:ignite 1.5s cubic-bezier(.2,.8,.3,1) both}
@keyframes ignite{
  0%{background:#cfe0fb;box-shadow:inset 0 0 0 1.5px #a9c6f3;transform:scaleY(.4)}
  35%{transform:scaleY(1.22)}
  55%{background:#eaffff;box-shadow:0 0 34px rgba(120,220,255,1),inset 0 0 0 1.5px #fff}
  100%{background:linear-gradient(180deg,#63e0ff,#2f8bff);box-shadow:0 0 12px rgba(60,170,255,.85),inset 0 0 0 1.5px #bfe9ff;transform:scaleY(1)}
}
.shieldbox.go .shwrap{animation:shpulse 1.5s ease-out both}
@keyframes shpulse{0%{transform:scale(.94)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.shcap{font-weight:900;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-align:center;line-height:1.25}
.shieldbox.go .shcap{animation:capin .7s .5s both}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shscale{font-size:12.5px;font-weight:800;letter-spacing:.09em;color:var(--blue);background:#eaf1ff;border-radius:999px;padding:7px 15px}
.shnote{color:var(--muted);font-size:14px;text-align:center;max-width:44ch;margin:0;line-height:1.5}

/* ===== ИСКРА (доп. задание) ===== */
.bonuscard{margin-top:20px;border:2px dashed #ffc978;background:linear-gradient(180deg,#fffaf0,#fff)}
.bonuscard .bhead{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:900;letter-spacing:.1em;color:#b06a12}
.bonuscard .bhead svg{color:#f0a020}
.bonuscard h3{margin:10px 0 6px;font-size:21px;letter-spacing:-.02em}
.bonuscard p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55}
.bonuscard .btn{margin-top:16px}
.bonuscard.done{border-style:solid;border-color:#ffd79a}
.sparkscore{display:inline-flex;align-items:center;gap:9px;background:#fff1d6;color:#a05d08;font-weight:900;
  border-radius:999px;padding:9px 17px;font-size:16px;margin-top:12px}
.sparkscore svg{width:19px;height:19px}
.bwait{margin-top:14px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* ===== ОТКРЫТИЕ (читают дети) ===== */
.dcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px;margin:18px 0 4px}
.dcard{border:1.6px solid var(--line);border-radius:18px;padding:16px 16px 18px;background:#fff;
  display:flex;flex-direction:column;gap:9px;transition:.2s}
.dcard .dic{width:54px;height:54px;border-radius:15px;background:#eef4ff;display:grid;place-items:center}
.dcard .dic svg{width:38px;height:38px;display:block}
.dcard b{font-size:13px;letter-spacing:.07em;color:var(--blue);font-weight:900}
.dcard span{font-size:14.5px;line-height:1.55;color:var(--ink)}
.dchk{margin-top:20px;border-radius:20px;background:#f3f7ff;border:1.6px solid #d9e6ff;padding:18px}
.dchk .dq2{font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:14px;line-height:1.35}
.dchk .opt{margin-bottom:9px}
.dres{margin-top:14px;border-radius:16px;padding:15px 16px;font-size:14.5px;line-height:1.55}
.dres.ok{background:#e8f8f0;border:1.6px solid #9fdfc2;color:#0d6a45}
.dres.no{background:#fff0ee;border:1.6px solid #f6c0b6;color:#a13a24}
.dres b{display:block;margin-bottom:5px;font-size:15px}
.dwaitline{margin-top:18px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}

/* ===== ПУЛЬТ: 10% ===== */
.sparkbox{border-radius:22px;padding:18px 20px;margin-bottom:20px;
  background:linear-gradient(140deg,#102a63,#1d47a8);color:#fff;box-shadow:0 14px 30px rgba(20,50,120,.22)}
.sparkbox .sparkh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sparkbox .slab{font-size:11px;font-weight:900;letter-spacing:.12em;color:#9dc0ff}
.sparkbox .sic{display:grid;place-items:center;color:#ffd166}
.sparkbox .stime{margin-left:auto;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.14);border-radius:999px;padding:5px 14px}
.sparkbox.live .stime{background:#ffd166;color:#22325c}
.sparksay{margin:0;font-size:19px;line-height:1.45;font-weight:700;letter-spacing:-.015em}
.sparkask{margin-top:12px;font-size:14px;color:#bfd6ff;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.sparkbox .btn.ghost{margin-top:14px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.sparkbox .btn.ghost:hover{background:rgba(255,255,255,.2)}
.sparkmeter{height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:13px;overflow:hidden}
.sparkmeter i{display:block;height:100%;background:#ffd166;border-radius:3px;transition:width 1s linear}
.talkshare{display:inline-flex;gap:7px;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  color:#9dc0ff;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px;margin-top:12px}

/* ===== ПУЛЬТ: открытие ===== */
.discstat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.discstat .ds{border:1.6px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.discstat .ds b{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em}
.discstat .ds span{font-size:12px;color:var(--muted)}
.discstat .ds.good b{color:var(--green)}
.discstat .ds.warn b{color:var(--orange)}

/* ===== КОДИРОВКА ===== */
.dkey{border-radius:18px;background:#f2f7ff;border:1.6px solid #d6e5ff;padding:14px 16px;margin:14px 0}
.dkeyh{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dkeyrow{display:flex;flex-wrap:wrap;gap:10px}
.dkc{display:flex;align-items:center;gap:6px;background:#fff;border:1.4px solid #dbe7fb;border-radius:13px;padding:6px 11px 6px 7px}
.dkc .dks svg{width:30px;height:30px;display:block}
.dkc .dke{color:var(--muted);font-weight:800}
.dkc .dkl{font-weight:900;font-size:19px;color:var(--ink);min-width:15px;text-align:center}
.dkc.solo{padding:9px 14px}
.dkc.solo .dkl{font-size:17px;letter-spacing:.02em}
.dwork{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0}
.dcellwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.dtop{width:60px;height:60px;border-radius:16px;background:#eef4ff;border:1.6px solid #dbe7fb;display:grid;place-items:center}
.dtop.word{width:auto;min-width:78px;max-width:170px;height:auto;min-height:54px;padding:10px 13px}
.dtop.word .dtx{font-size:15.5px;line-height:1.2;font-weight:800;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.dtop svg{width:44px;height:44px;display:block}
.dtop .dtx{font-size:27px;font-weight:900;color:var(--ink)}
.dslot{width:60px;height:60px;border-radius:16px;border:2.4px dashed #b9cdf0;background:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:26px;font-weight:900;color:var(--ink);transition:.16s;padding:0}
.dslot .dq{color:#b9cdf0;font-size:24px}
.dslot:hover{border-color:var(--blue);background:#f6f9ff}
.dslot.full{border-style:solid;border-color:var(--blue);background:#eaf1ff;animation:dpop .28s}
.dslot svg{width:42px;height:42px;display:block}
@keyframes dpop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.dbank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding-top:6px;border-top:1.4px dashed var(--line)}
.dbtn{display:flex;align-items:center;gap:7px;border:1.6px solid var(--line);background:#fff;border-radius:14px;
  padding:8px 13px;cursor:pointer;font-weight:900;font-size:18px;color:var(--ink);transition:.16s}
.dbtn:hover{border-color:var(--blue);background:#f4f8ff;transform:translateY(-2px)}
.dbtn svg{width:32px;height:32px;display:block}
.dbtn span{font-size:16px}
.dhint{font-size:13.5px;color:var(--muted);text-align:center;margin:0}

/* ===== мелочи ===== */
.zicon{display:block;margin:0 auto}
.zicon svg{width:38px;height:38px;display:block;margin:0 auto}
.zone>div:first-child{display:flex;justify-content:center}
.ordic{flex:none;width:30px;height:30px;display:inline-flex}
.ordic svg{width:100%;height:100%}
.mim.ico{width:52px;height:52px;display:grid;place-items:center}
.mim.pho{width:82px;height:82px;display:grid;place-items:center}
.mim.pho img{width:82px;height:82px;object-fit:contain;display:block}
.mim.ico svg{width:46px;height:46px;display:block}
.mw .mwic svg{width:44px;height:44px;display:block}
.btn.small{padding:10px 16px;font-size:14px}
@media(max-width:560px){
  .dcards{grid-template-columns:1fr}
  .dtop,.dslot{width:52px;height:52px}
  .dtop.word{width:auto;height:auto;min-width:68px;max-width:132px;padding:8px 10px}
  .dtop.word .dtx{font-size:13.5px}
  .dtop svg,.dslot svg{width:38px;height:38px}
  .sparksay{font-size:17px}
  .discstat{grid-template-columns:1fr 1fr}
}

/* ===== ЭКРАН ДЛЯ КЛАССА ===== */
.board .viewer{max-width:none}
.board .viewer img{width:100%}
.bcard{border-radius:24px;background:#fff;border:1.6px solid var(--line);padding:26px 28px;margin-top:20px;
  box-shadow:0 12px 30px rgba(20,50,120,.07)}
.beb{font-size:12px;font-weight:900;letter-spacing:.13em;color:var(--blue);margin-bottom:10px}
.bq{font-size:clamp(24px,3.1vw,38px);margin:0;letter-spacing:-.03em;line-height:1.2}
.bsub{margin:12px 0 0;font-size:clamp(15px,1.5vw,20px);color:var(--muted);line-height:1.45}
.bbig{margin-top:18px;display:inline-flex;align-items:center;gap:12px;font-size:clamp(22px,2.6vw,34px);
  font-weight:900;letter-spacing:-.02em;background:#eaf1ff;color:var(--blue);border-radius:999px;padding:10px 24px}
.btally{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.btal .blb{display:flex;justify-content:space-between;font-weight:800;font-size:clamp(15px,1.7vw,21px);margin-bottom:7px}
.btal .btb{height:18px;border-radius:9px;background:#eaf1ff;overflow:hidden}
.btal .btb i{display:block;height:100%;background:linear-gradient(90deg,#5b93ff,#1f4fd8);border-radius:9px;transition:width .5s}
.btal.right .btb i{background:linear-gradient(90deg,#3ddc9a,#16a86e)}
.btal.right .blb{color:var(--green)}
.bexp{margin-top:20px;border-radius:18px;background:#eef6ff;border:1.6px solid #cfe2ff;padding:18px 20px;
  font-size:clamp(15px,1.6vw,20px);line-height:1.5}
.bchips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.bchip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 16px;font-weight:800;
  font-size:15px;background:#fff;border:1.6px solid var(--line);color:var(--muted)}
.bchip.ok{background:#e8f8f0;border-color:#9fdfc2;color:#0d6a45}
.bchip.ok svg{color:#16a86e}
.bjoin{margin-top:20px;font-size:clamp(17px,2vw,24px);color:var(--muted)}
.bjoin b{color:var(--blue);letter-spacing:.1em}
.bbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.bbar .btn{font-size:17px;padding:15px 26px}
.bswitch{margin-left:auto}
.privwarn{display:flex;gap:10px;align-items:center;border-radius:14px;background:#fff4e2;border:1.6px solid #ffd29a;
  color:#96540a;font-size:13.5px;font-weight:700;padding:11px 15px;margin-bottom:18px;line-height:1.4}
.tjoinbox{margin-top:18px;border-top:1.4px dashed var(--line);padding-top:18px}
.tjoinbox .lab3{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.tjoinrow{display:flex;gap:10px;flex-wrap:wrap}
.tjoinrow .inp{max-width:160px;letter-spacing:.25em;font-weight:900;text-align:center}

.consbar{position:fixed;left:16px;bottom:16px;z-index:70;display:flex;align-items:center;gap:10px;
  background:#fff;border:1.6px solid #ffd29a;border-radius:999px;padding:8px 8px 8px 16px;
  box-shadow:0 12px 30px rgba(20,50,120,.18)}
.consbar .cw{font-size:13px;font-weight:800;color:#96540a;display:flex;align-items:center;gap:8px;white-space:nowrap}
.consbar .btn{padding:10px 18px;font-size:14px}
@media(max-width:620px){.consbar{left:10px;right:10px;bottom:10px;justify-content:space-between;padding:8px}
  .consbar .cw{font-size:11.5px;white-space:normal}}

/* ===== РАЗМИНКА: три действия, музыка, голос ===== */
.warmrules{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.wr{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 16px;font-weight:900;
  font-size:14.5px;letter-spacing:.02em;border:2px solid;background:rgba(255,255,255,.06)}
.wr .wk{font-size:20px;line-height:1}
.wr .wn{display:flex;flex-direction:column;gap:2px;text-align:left}
.wr .wn i{font-style:normal;font-size:11.5px;font-weight:700;opacity:.72;letter-spacing:.04em}
.wr.znak{border-color:#5b93ff;color:#a8c8ff}
.wr.simvol{border-color:#ffb547;color:#ffd79a}
.wr.kod{border-color:#3ddc9a;color:#9cf0cd}
.warmstage .wbadge{display:inline-flex;align-items:center;gap:9px;border-radius:999px;padding:8px 20px;
  font-weight:900;font-size:15px;letter-spacing:.08em;margin-top:16px;border:2px solid}
.wbadge.znak{border-color:#5b93ff;color:#a8c8ff}
.wbadge.simvol{border-color:#ffb547;color:#ffd79a}
.wbadge.kod{border-color:#3ddc9a;color:#9cf0cd}
.wtog{display:flex;gap:8px;align-items:center;color:#8fb0f0;font-size:13px;font-weight:800}
.wtog button{border:1.6px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#cfe0ff;
  border-radius:12px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;transition:.16s}
.wtog button.on{background:#ffd166;border-color:#ffd166;color:#22325c}
.warmsum{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.warmsum .ws{border-radius:16px;border:2px solid rgba(255,255,255,.18);padding:12px 20px;text-align:center;color:#cfe0ff}
.warmsum .ws b{display:block;font-size:26px;font-weight:900}
.warmsum .ws span{font-size:12px;opacity:.8;letter-spacing:.05em}

/* ===== HOTSPOT: нажми на нужное место картинки ===== */
.hs{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:14px}
.hscard{display:flex;align-items:center;gap:14px;border-radius:20px;border:2px solid var(--blue);
  background:#eef4ff;padding:14px 20px;min-height:74px;max-width:100%}
.hscard .hsic svg{width:46px;height:46px;display:block}
.hscard b{font-size:19px;letter-spacing:-.02em;line-height:1.25}
.hscene{width:100%;max-width:420px}
.hscene svg{width:100%;height:auto;display:block;touch-action:manipulation}
.hspot{cursor:pointer}
.hspot .hit{fill:transparent;stroke:#b9cdf0;stroke-width:2.4;stroke-dasharray:5 5;transition:.16s}
.hspot:hover .hit{stroke:var(--blue);fill:rgba(47,107,240,.09)}
.hspot.on .hit{stroke:var(--blue);stroke-dasharray:none;stroke-width:3.4;fill:rgba(47,107,240,.16)}
.hspot .hlab{font:800 12px system-ui,sans-serif;fill:#42557a;text-anchor:middle;pointer-events:none;
  stroke:#fff;stroke-width:3.4;paint-order:stroke fill;stroke-linejoin:round}
.hspot.on .hlab{fill:var(--blue)}
.hsdots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hsdot{width:auto;min-width:34px;height:34px;border-radius:11px;border:1.8px solid var(--line);background:#fff;
  display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--muted);cursor:pointer;padding:0 8px}
.hsdot.done{background:#e8f8f0;border-color:#9fdfc2;color:#0d6a45}
.hsdot.cur{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,240,.14)}
.hsnav{display:flex;gap:10px}
.hsnav button{border:1.6px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;
  font-weight:800;font-size:14px;cursor:pointer;color:var(--ink)}
.hsnav button:disabled{opacity:.4;cursor:default}

/* ===== GRID2: два вопроса к каждому сообщению ===== */
.g2{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.g2row{border-radius:18px;border:1.6px solid var(--line);background:#fff;padding:14px 16px}
.g2head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.g2head .g2ic svg{width:40px;height:40px;display:block}
.g2head b{font-size:16px;line-height:1.3;letter-spacing:-.01em}
.g2q{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.g2q .g2l{font-size:13.5px;font-weight:800;color:var(--muted);min-width:168px}
.g2q .yn{display:flex;gap:7px}
.g2q .yn button{border:1.6px solid var(--line);background:#fff;border-radius:11px;padding:8px 16px;
  font-weight:800;font-size:14px;cursor:pointer;color:var(--ink);transition:.15s}
.g2q .yn button:hover{border-color:var(--blue)}
.g2q .yn button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.g2q .yn button.no.on{background:var(--orange);border-color:var(--orange)}
.g2v{margin-top:6px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 15px;
  font-weight:900;font-size:13px;letter-spacing:.04em}
.g2v.use{background:#e8f8f0;color:#0d6a45}
.g2v.noise{background:#fff1e2;color:#a3560b}
.g2v.lie{background:#ffeced;color:#b2243a}
.g2v.both{background:#f1e9ff;color:#6b32a8}
@media(max-width:520px){.g2q .g2l{min-width:0;width:100%}}

/* ===== CHAIN: источник → канал → получатель ===== */
.ch{margin-top:14px}
.chcard{display:flex;align-items:center;gap:13px;border-radius:20px;border:2px solid var(--blue);
  background:#eef4ff;padding:14px 18px;margin-bottom:16px}
.chcard .chic svg{width:44px;height:44px;display:block}
.chcard b{font-size:18px;line-height:1.3;letter-spacing:-.02em}
.chstep{position:relative;border-radius:18px;border:1.6px solid var(--line);background:#fff;padding:13px 15px;margin-bottom:26px}
.chstep:last-child{margin-bottom:0}
.chstep::after{content:"";position:absolute;left:50%;bottom:-22px;width:2.6px;height:18px;background:#c6d7f4;transform:translateX(-50%)}
.chstep:last-child::after{display:none}
.chstep::before{content:"";position:absolute;left:50%;bottom:-26px;border:6px solid transparent;border-top-color:#c6d7f4;transform:translateX(-50%)}
.chstep:last-child::before{display:none}
.chstep.done{border-color:var(--blue);background:#f6f9ff}
.chl{font-size:11.5px;font-weight:900;letter-spacing:.11em;color:var(--blue);margin-bottom:10px}
.chopts{display:flex;flex-wrap:wrap;gap:8px}
.chopt{display:flex;align-items:center;gap:8px;border:1.6px solid var(--line);background:#fff;border-radius:13px;
  padding:9px 14px;cursor:pointer;font-weight:800;font-size:14.5px;color:var(--ink);transition:.15s}
.chopt:hover{border-color:var(--blue);background:#f6f9ff}
.chopt.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chopt svg{width:26px;height:26px;display:block}
.chopt.on svg{filter:brightness(0) invert(1)}
.chdots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* ===== STRIKE: зачеркни лишнее на странице ===== */
.st{margin-top:14px;border-radius:20px;border:2px solid var(--line);overflow:hidden;background:#fff}
.sthead{background:linear-gradient(135deg,#1b3a8f,#2f6bf0);color:#fff;padding:13px 18px;
  font-weight:900;font-size:14.5px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.sthead .dotz{display:flex;gap:5px}
.sthead .dotz i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)}
.sttiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px}
.sttile{position:relative;border:1.8px solid var(--line);border-radius:15px;background:#fbfdff;padding:13px 14px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;transition:.16s;min-height:78px}
.sttile:hover{border-color:var(--orange)}
.sttile .stic svg{width:32px;height:32px;display:block}
.sttile span{font-size:14px;line-height:1.35;font-weight:700;color:var(--ink)}
.sttile.out{background:#fff2ef;border-color:#f3b3a2}
.sttile.out span{color:#9a4a33;opacity:.75}
.sttile.out .stic{opacity:.45}
.sttile .stline{position:absolute;left:8px;right:8px;top:50%;height:3.4px;border-radius:2px;background:#e0435a;
  transform:scaleX(0);transform-origin:left center;transition:transform .22s ease-out}
.sttile.out .stline{transform:scaleX(1)}
.stbar{display:flex;align-items:center;gap:10px;padding:0 14px 14px;font-size:13.5px;color:var(--muted)}
.sttiles.astext{display:block;padding:20px 18px;font-size:19px;line-height:2.1;text-align:left}
.sttiles.astext .sttile{display:inline;min-height:0;border:none;background:none;padding:2px 3px;margin:0 1px;
  border-radius:7px;font-size:19px;font-weight:700;color:var(--ink);box-shadow:inset 0 -2px 0 rgba(47,107,240,.18)}
.sttiles.astext .sttile:hover{background:#fff1ec;box-shadow:inset 0 -2px 0 var(--orange)}
.sttiles.astext .sttile.out{background:#ffece8;color:#b2243a;box-shadow:none;text-decoration:line-through;
  text-decoration-color:#e0435a;text-decoration-thickness:3px;opacity:.72}
.sttiles.astext .stline{display:none}
.stshort{margin:0 14px 14px;border-radius:14px;background:#eef8f1;border:1.6px solid #9fdfc2;padding:13px 16px;
  font-size:16px;font-weight:800;color:#0d6a45;line-height:1.45}
.stshort i{display:block;font-style:normal;font-size:11.5px;letter-spacing:.1em;color:#16a86e;margin-bottom:6px}
@media(max-width:520px){.sttiles.astext,.sttiles.astext .sttile{font-size:17px}}
.stbar b{color:var(--orange)}

/* --- картинка в варианте голосования (на доске и у ребёнка) --- */
.btic{display:inline-flex;width:34px;height:34px;vertical-align:-9px;margin-right:10px}
.btic svg{width:100%;height:100%}
.pollopt .pic{flex:none;width:46px;height:46px;display:inline-flex}
.pollopt .pic svg{width:100%;height:100%}
.pollopt.big{padding:16px 18px;gap:12px;font-size:19px;font-weight:800;line-height:1.15}
.pollopt.big .k{width:30px;height:30px;border-radius:10px;font-size:14px}
@media(max-width:560px){
 .pollopt.big{padding:14px;font-size:18px}
 .pollopt .pic{width:42px;height:42px}
}
/* --- компактная сетка карточек для 1 класса: два столбца вместо одного --- */
:root[data-compact] .cases{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
:root[data-compact] .case{min-height:0;padding:10px 10px 12px;text-align:center}
:root[data-compact] .case .cn{width:22px;height:22px;font-size:12px;line-height:22px}
:root[data-compact] .case .ct{font-size:15px;line-height:1.15;margin:26px 0 6px;font-weight:800}
:root[data-compact] .case .cim{height:76px;width:76px;margin:0 auto;aspect-ratio:auto}
:root[data-compact] .case .cim svg{width:64px;height:64px}
:root[data-compact] .case .cmark{top:8px;right:8px;width:22px;height:22px;font-size:13px;line-height:22px}
@media(max-width:720px){
 :root[data-compact] .cases{grid-template-columns:repeat(2,minmax(0,1fr))}
 :root[data-compact] .case{min-height:0}
 :root[data-compact] .case .cim{height:70px;width:70px}
}
@media(max-width:380px){
 :root[data-compact] .case .ct{font-size:13.5px}
 :root[data-compact] .case .cim{height:62px;width:62px}
 :root[data-compact] .case .cim svg{width:52px;height:52px}
}

/* --- три настроения в один ряд, чтобы малышу не пришлось листать --- */
:root[data-compact] .moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
:root[data-compact] .mood{padding:12px 8px;font-size:13.5px;text-align:center;justify-content:center}
:root[data-compact] .mim.pho,:root[data-compact] .mim.pho img{width:70px;height:70px}
@media(max-width:380px){
 :root[data-compact] .mim.pho,:root[data-compact] .mim.pho img{width:58px;height:58px}
 :root[data-compact] .mood{font-size:12.5px}
}

/* --- подпись «что делать» крупно, для тех, кто читает по слогам --- */
.k1do{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:13px 16px;border-radius:16px;
 background:#eef3ff;border:2px solid #cfdcfb}
.k1do .ic{flex:none;width:34px;height:34px;display:inline-flex}
.k1do .ic svg{width:100%;height:100%}
.k1do b{font-size:18px;letter-spacing:-.01em;color:#16307a}

.kt{margin-top:14px}
.ktline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px}
.ktch{width:52px;height:60px;border-radius:14px;display:grid;place-items:center;
 font-size:26px;font-weight:900;background:#f1f4fa;color:#98a6c0;border:2px solid transparent;
 transition:.12s;font-family:system-ui,sans-serif}
.ktch.done{background:#e6f7ef;color:#12855a;border-color:#a7e2c8}
.ktch.cur{background:#fff;color:var(--blue);border-color:var(--blue);
 box-shadow:0 8px 22px rgba(31,79,216,.22);transform:translateY(-3px)}
.ktch.cur.bad{border-color:var(--red);color:var(--red);animation:ktshake .3s}
@keyframes ktshake{0%,100%{transform:translateY(-3px)}25%{transform:translate(-5px,-3px)}75%{transform:translate(5px,-3px)}}
.kthead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ktstep{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.kthearts{font-size:17px;letter-spacing:2px}
.kthearts i{font-style:normal;opacity:.22}
.kthearts i.on{opacity:1}
.ktbar{height:8px;border-radius:5px;background:#e9eefb;overflow:hidden;margin-bottom:12px}
.ktbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#52a2ff);transition:width .2s}
.ktkb{background:#132347;border-radius:16px;padding:10px 8px 12px;display:grid;gap:5px}
.ktrow{display:flex;gap:4px;justify-content:center}
.ktkey{flex:1 1 0;min-width:0;aspect-ratio:1/1;max-width:46px;border-radius:9px;border:none;
 background:#22345f;color:#c7d6f5;font-size:14px;font-weight:800;display:grid;place-items:center;
 cursor:pointer;transition:.12s;font-family:system-ui,sans-serif;padding:0}
.ktkey:hover{background:#2c4176}
.ktkey.hot{background:var(--orange);color:#fff;box-shadow:0 0 0 3px rgba(239,111,69,.3);transform:translateY(-2px)}
.ktkey.spc{flex:0 0 46%;aspect-ratio:auto;height:30px;max-width:none}
.ktdone{text-align:center;padding:16px 12px;border-radius:16px;background:#e6f7ef;border:2px solid #a7e2c8}
.ktdone b{display:block;font-size:20px;color:#12855a;margin-bottom:4px}
.ktdone span{font-size:14px;color:#3c6b56}
.ktnote{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted)}
@media(max-width:560px){
 .ktch{width:42px;height:50px;font-size:21px;border-radius:12px}
 .ktkey{font-size:12px;border-radius:7px}
 .ktkb{padding:8px 5px 10px}
}
@media(max-width:380px){
 .ktch{width:36px;height:44px;font-size:18px}
 .ktkey{font-size:10.5px;border-radius:6px}
}

/* ---------- работа в парах ---------- */
.prbadge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 15px;
 background:#fff3e9;color:#b8471f;font-size:12px;font-weight:900;letter-spacing:.09em}
.prmate{display:flex;align-items:center;gap:13px;margin:16px 0;padding:15px 17px;border-radius:18px;
 background:linear-gradient(135deg,#fff6ef,#ffeee2);border:2px solid #f6c9ad}
.prmate .pav{flex:none;width:46px;height:46px;border-radius:14px;background:var(--orange);color:#fff;
 display:grid;place-items:center;font-size:19px;font-weight:900}
.prmate b{display:block;font-size:19px;letter-spacing:-.01em;color:#8c3a18}
.prmate span{font-size:13px;color:#b06a48}
.prstep{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.prstep:last-child{border-bottom:none}
.prstep i{flex:none;width:26px;height:26px;border-radius:9px;background:var(--blue-l2);color:var(--blue);
 display:grid;place-items:center;font-size:13px;font-weight:900;font-style:normal}
.prstep b{font-size:15px;display:block;margin-bottom:1px}
.prstep span{font-size:13.5px;color:var(--muted);line-height:1.4}
.prlist{display:grid;gap:9px;margin-top:16px}
.prrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:#f5f8ff;
 border:2px solid transparent;font-size:15px;font-weight:700}
.prrow.same{background:#e9f8f0;border-color:#a7e2c8}
.prrow.diff{background:#fff1f2;border-color:#f6c2c8}
.prrow .pn{flex:none;width:26px;height:26px;border-radius:9px;background:#fff;display:grid;place-items:center;
 font-size:12px;font-weight:900;color:var(--muted);box-shadow:var(--sh-s)}
.prrow .pv{margin-left:auto;font-size:12.5px;font-weight:800;letter-spacing:.04em}
.prrow.same .pv{color:#12855a}.prrow.diff .pv{color:#c33}
.prsum{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.prsum .ps{flex:1 1 150px;border-radius:16px;padding:14px 16px;background:#f5f8ff;text-align:center}

/* ===== FORM: анкета, в которой поля можно нажимать ===== */
.frm{margin-top:14px;border-radius:22px;border:3px solid #9cc2f5;background:#eaf3ff;padding:12px}
.frmin{border-radius:17px;background:#fff;padding:14px 12px 16px}

  background:#fbfdff;padding:11px 13px;margin-bottom:10px;cursor:pointer;position:relative;
  text-align:left;width:100%;transition:.15s}
.frow:last-child{margin-bottom:0}
.frow:hover{border-color:var(--blue);background:#f4f8ff}

  align-items:center;justify-content:center}

.fline{height:20px;border:1.4px solid #d8e6f8;border-radius:7px;background:#fff;margin-bottom:5px}

.fdots i{width:17px;height:17px;border-radius:50%;display:block}
.fbox{flex:none;width:52px;height:38px;border:1.6px dashed #b9d2f0;border-radius:9px;background:#f2f8ff;
  display:flex;align-items:center;justify-content:center;align-self:center}
.fbox svg{width:22px;height:22px;opacity:.55}
.fmark{position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--orange);
  color:#fff;font-size:14px;font-weight:900;display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(240,107,52,.4)}
.frow.on .fmark{display:flex}

.frmbar b{color:var(--orange)}

/* ===== PICKS: карточки с картинками занятия ===== */
.pks{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:620px){.pks{grid-template-columns:1fr 1fr}}
.pkc{position:relative;border:2px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;
  cursor:pointer;text-align:left;padding:0;transition:.16s;display:block;width:100%}
.pkc:hover{border-color:var(--blue)}
.pkc.on{border-color:var(--orange);box-shadow:0 0 0 3px rgba(240,107,52,.16)}
/* Высоту картинки приходится ограничивать: карточки вырезаются из разных
   слайдов, и почти квадратная картинка растягивала экран так, что ребёнку
   нужно было листать страницу вместо того, чтобы сравнивать карточки.
   contain, а не cover: обрезать карточку по краям нельзя — именно по ней
   и принимают решение. */
.pkc img{display:block;width:100%;height:auto;max-height:210px;object-fit:contain;background:#eef4ff}
.pkt{padding:11px 13px 13px;font-size:15px;line-height:1.35;font-weight:800;color:var(--ink)}
.pkn{position:absolute;top:9px;left:9px;width:26px;height:26px;border-radius:9px;background:var(--blue);color:#fff;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(27,58,143,.3)}
.pkc.on .pkn{background:var(--orange)}
.pkm{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;background:var(--orange);
  color:#fff;font-size:16px;font-weight:900;display:none;align-items:center;justify-content:center}
.pkc.on .pkm{display:flex}
.pkbar{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.pkbar b{color:var(--orange)}

/* ===== PMATCH: картинка слева, подпись справа — всё на одном экране ===== */
.pm{margin-top:14px}
.pmrow{display:flex;align-items:stretch;gap:10px;border:2px solid var(--line);border-radius:16px;
  background:#fff;overflow:hidden;margin-bottom:10px}

.pmrow.cur{border-color:var(--orange);box-shadow:0 0 0 3px rgba(240,107,52,.14)}
.pmpic{position:relative;flex:0 0 42%;max-width:190px;padding:0;border:none;background:#eef4ff;
  cursor:pointer;display:block}
/* contain, а не cover: широкую переписку нельзя обрезать по краям — тогда
   от сообщения остаётся середина, и прочитать его уже нельзя. */
.pmpic{display:flex;align-items:center;justify-content:center}
.pmpic img{display:block;width:100%;height:auto;object-fit:contain;min-height:88px;max-height:132px}

  color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.pmrow.done .pmn{background:var(--orange)}

  background:none;border:none;cursor:pointer}

function initOnlineDB(){

function exReady(b,a){
 if(!a)return false;
 if(b.kind==="mcq")return Number.isInteger(a.choice);
 if(b.kind==="multi")return Array.isArray(a.multi)&&a.multi.length>0;
 if(b.kind==="match")return !!a.map&&Object.keys(a.map).length===b.pairs.length;
 if(b.kind==="order")return Array.isArray(a.order)&&a.order.length===b.steps.length;
 if(b.kind==="yn")return !!a.yn&&Object.keys(a.yn).length===b.items.length;
 return false;
}
function sameSet(a,b){
 const x=[...(a||[])].map(Number).sort((m,n)=>m-n),y=[...(b||[])].map(Number).sort((m,n)=>m-n);
 return x.length===y.length&&x.every((v,i)=>v===y[i]);
}
function exScore(b,a){
 a=a||{};
 if(b.kind==="mcq")return{s:a.choice===b.ok?1:0,t:1};
 if(b.kind==="multi")return{s:sameSet(a.multi,b.ok)?1:0,t:1};
 if(b.kind==="match"){
   let s=0;const mp=a.map||{};
   b.pairs.forEach((p,i)=>{if(Number(mp[i])===i)s++;});
   return{s,t:b.pairs.length};
 }
 if(b.kind==="order"){
   const o=a.order||[];let s=0;
   b.steps.forEach((x,i)=>{if(o[i]===i)s++;});
   return{s,t:b.steps.length};
 }
 if(b.kind==="yn"){
   const y=a.yn||{};let s=0;
   b.items.forEach((x,i)=>{if(y[i]===x.ok)s++;});
   return{s,t:b.items.length};
 }
 return{s:0,t:1};
}

function counterText(){
 const T=LESSON.stages[V.state.stage].task,d=V.draft;
 if(T.type==="cases") return `${T.counter}: ${(d.sel||[]).length}${T.required?"/"+T.required:""}`;
 if(T.type==="sort") return `${T.counter}: ${Object.keys(d.zone||{}).length}/${T.items.length}`;
 if(T.type==="contracts"){let n=0;T.items.forEach((x,i)=>{if((d.pick||{})[i]!==undefined&&(!x.args||((d.args||{})[i]||[]).length===2))n++;});
   return `${T.counter}: ${n}/${T.items.length}`;}
 if(T.type==="yesno") return `${T.counter}: ${Object.keys(d.yn||{}).length}/${T.items.length}`;
 if(T.type==="exam"){const e=d.ex||{};let n=0;T.blocks.forEach((b,i)=>{if(exReady(b,e[i]))n++;});
   return `${T.counter}: ${n+(T.moods&&d.mood?1:0)}/${T.blocks.length+(T.moods?1:0)}`;}
 return "";
}
function taskReady(){
 const T=LESSON.stages[V.state.stage].task,d=V.draft;
 if(T.type==="cases") return T.required?(d.sel||[]).length===T.required:(d.sel||[]).length>0;
 if(T.type==="sort") return Object.keys(d.zone||{}).length===T.items.length;
 if(T.type==="contracts") return T.items.every((x,i)=>(d.pick||{})[i]!==undefined&&(!x.args||((d.args||{})[i]||[]).length===2));
 if(T.type==="yesno") return Object.keys(d.yn||{}).length===T.items.length;
 if(T.type==="exam"){const e=d.ex||{};return T.blocks.every((b,i)=>exReady(b,e[i]))&&(!T.moods||!!d.mood);}
 return false;
}
function taskFilled(){
 const T=LESSON.stages[V.state.stage].task,d=V.draft;
 if(T.type==="cases") return T.required?(d.sel||[]).length===T.required:(d.sel||[]).length>0;
 if(T.type==="sort") return Object.keys(d.zone||{}).length===T.items.length;
 if(T.type==="contracts") return T.items.every((x,i)=>(d.pick||{})[i]!==undefined&&(!x.args||((d.args||{})[i]||[]).length===2));
 if(T.type==="yesno") return Object.keys(d.yn||{}).length===T.items.length;
 if(T.type==="exam"){const e=d.ex||{};return T.blocks.every((b,i)=>exReady(b,e[i]))&&(!T.moods||!!d.mood);}
 return false;
}
function scoreTask(){
 const T=LESSON.stages[V.state.stage].task,d=V.draft;
 if(T.type==="cases"){const sel=d.sel||[];let c=0;
   const want=x=>T.mode==="safe"?!x.bad:x.bad;
   T.cases.forEach((x,i)=>{const picked=sel.includes(i);if(picked===want(x))c++;});
   return{score:c,total:T.cases.length};}
 if(T.type==="sort"){let c=0;T.items.forEach((x,i)=>{const z=(d.zone||{})[i];if(z===x.zone)c++;});
   return{score:c,total:T.items.length};}
 if(T.type==="contracts"){let c=0,t=0;T.items.forEach((x,i)=>{t++;if((x.accepted||[x.ok]).includes((d.pick||{})[i]))c++;
   if(x.args){t++;const q=((d.args||{})[i]||[]).slice().sort().join(",");if(q===x.args.ok.slice().sort().join(","))c++;}});
   return{score:c,total:t};}
 if(T.type==="yesno"){let c=0;T.items.forEach((x,i)=>{if((d.yn||{})[i]===x.ok)c++;});return{score:c,total:T.items.length};}
 if(T.type==="exam"){const e=d.ex||{};let c=0,t=0;
   T.blocks.forEach((b,i)=>{const r=exScore(b,e[i]);c+=r.s;t+=r.t;});return{score:c,total:t};}
 return{score:0,total:1};
}

function reviewStage(stage,rec){

   ${your!==undefined?`<div class="reviewanswers">

   </div>`:""}</div>`;
 let body="";
 if(T.type==="cases"){
   const sel=a.sel||[],safe=T.mode==="safe";
   body=T.cases.map((x,i)=>{
     const got=sel.includes(i),want=safe?!x.bad:x.bad,ok=got===want;
     const your=safe?(got?(T.labYes||"Выбрано как верное"):(T.labNo||"Не отметил")):(got?"Нарушение":"Безопасно");
     const cor=safe?(x.bad?(T.labIsNot||"Утверждение неверно"):(T.labIs||"Утверждение верно")):(x.bad?"Нарушение":"Безопасно");
     return row(ok,x.t,your,cor);}).join("");
 }
 if(T.type==="sort"){
   const z=a.zone||{};
   body=T.items.map((x,i)=>{const byKey=Object.fromEntries(T.zones.map(v=>[v.k,v.t]));return row(z[i]===x.zone,x.t,byKey[z[i]]||"Не размещено",byKey[x.zone]);}).join("");
 }
 if(T.type==="contracts"){
   const p=a.pick||{},ag=a.args||{};
   body=T.items.map((x,i)=>{
     let h=row((x.accepted||[x.ok]).includes(p[i]),x.t,T.devices[p[i]]?T.devices[p[i]].t:"Нет ответа",(x.accepted||[x.ok]).map(j=>T.devices[j].t).join(" или "));
     if(x.args){const sel=(ag[i]||[]).slice().sort(),ok=x.args.ok.slice().sort();
       h+=row(sel.join(",")===ok.join(","),"Аргументы · "+x.t,
         sel.length?sel.map(j=>x.args.opts[j]).join("; "):"Нет ответа",ok.map(j=>x.args.opts[j]).join("; "));}
     return h;}).join("");
 }
 if(T.type==="yesno"){
   const y=a.yn||{};
   body=T.items.map((x,i)=>row(y[i]===x.ok,x.q,y[i]===true?"Да":(y[i]===false?"Нет":"Нет ответа"),x.ok?"Да":"Нет")).join("");
 }
 if(T.type==="exam"){
   const e=a.ex||{};

       const correct=b.steps.map((s,j)=>`${j+1}. ${s}`).join("; ");

     }

   }).join("");
 }

const MCOL=["#1f4fd8","#ef6f45","#16a86e","#9b59d0","#e0a400","#0fb5c9"];
const YN_NO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const mcolor=i=>MCOL[i%MCOL.length];
const micon=k=>(typeof ICON!=="undefined"&&ICON[k])?ICON[k]:ICON._def;
let mNew=null,mDrag=null,sDrag=null,mNoClick=0,mRO=null,sNew=null,mGhost=null;
function exLink(bi,ti,di){
 V.draft.ex=V.draft.ex||{};const a=V.draft.ex[bi]=V.draft.ex[bi]||{};a.map=a.map||{};
 Object.keys(a.map).forEach(k=>{if(Number(a.map[k])===di)delete a.map[k];});
 a.map[ti]=di;a.hold=null;mNew={bi:bi,ti:ti,di:di,at:Date.now()};
}
function sortDrop(i,zone){
 V.draft.zone=V.draft.zone||{};V.draft.zone[i]=zone;V.draft.hold=null;sNew={i:i,at:Date.now()};
}
function mPath(x1,y1,x2,y2){const dx=Math.max(22,(x2-x1)*.55);return `M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`;}
function mLine(svg,key,d,color,animate){
 let p=svg.querySelector(`[data-k="${key}"]`);
 if(!p){p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("data-k",key);svg.appendChild(p);}
 p.setAttribute("class",key==="live"?"mlive":("mline"+(animate?" new":"")));
 p.setAttribute("d",d);p.setAttribute("stroke",color);
 if(animate){try{const L=p.getTotalLength();p.style.setProperty("--len",L);p.style.strokeDasharray=L;}catch(e){}}
 else{p.style.strokeDasharray="";p.style.removeProperty("--len");}
 return p;
}
function drawMatchLines(live){
 el.querySelectorAll(".mtch[data-mblock]").forEach(box=>{
  const svg=box.querySelector(".mlines");if(!svg)return;
  const bi=Number(box.dataset.mblock),a=((V.draft||{}).ex||{})[bi]||{},mp=a.map||{};
  const r=box.getBoundingClientRect();if(r.width<2)return;
  svg.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);
  const keep={};
  Object.keys(mp).forEach(k=>{
   const ti=Number(k),di=Number(mp[k]);
   const A=box.querySelector(`[data-exterm="${bi}:${ti}"]`),B=box.querySelector(`[data-exdef="${bi}:${di}"]`);
   if(!A||!B)return;
   const ra=A.getBoundingClientRect(),rb=B.getBoundingClientRect();
   if(rb.left<ra.right-4)return;
   const d=mPath(ra.right-r.left,ra.top+ra.height/2-r.top,rb.left-r.left,rb.top+rb.height/2-r.top);
   const fresh=!!(mNew&&mNew.bi===bi&&mNew.ti===ti&&Date.now()-mNew.at<700);
   keep["l"+ti]=1;mLine(svg,"l"+ti,d,mcolor(ti),fresh);
  });
  svg.querySelectorAll("[data-k]").forEach(p=>{const k=p.getAttribute("data-k");
   if(k==="live"){if(!live||live.bi!==bi)p.remove();}else if(!keep[k])p.remove();});
  if(live&&live.bi===bi){
   const A=box.querySelector(`[data-exterm="${bi}:${live.ti}"]`);
   if(A){const ra=A.getBoundingClientRect();
    mLine(svg,"live",mPath(ra.right-r.left,ra.top+ra.height/2-r.top,live.x-r.left,live.y-r.top),mcolor(live.ti),false);}
  }
 });
}
function markFresh(){
 if(mNew&&Date.now()-mNew.at<700){
  const box=el.querySelector(`.mtch[data-mblock="${mNew.bi}"]`);
  if(box)box.querySelectorAll(`[data-exterm="${mNew.bi}:${mNew.ti}"],[data-exdef="${mNew.bi}:${mNew.di}"]`)
    .forEach(n=>{n.classList.remove("pop");void n.offsetWidth;n.classList.add("pop");});
 }
 if(sNew&&Date.now()-sNew.at<700){
  const b=el.querySelector(`[data-unzone="${sNew.i}"]`);
  if(b){b.classList.remove("drop-in");void b.offsetWidth;b.classList.add("drop-in");}
 }
}
function ghostOn(html,x,y){

 document.body.appendChild(mGhost);ghostMove(x,y);
}

function bindMatch(){

 boxes.forEach(box=>{

  box.querySelectorAll("[data-exterm]").forEach(t=>{
   t.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch")return;
    const bi=Number(box.dataset.mblock),ti=Number(t.dataset.exterm.split(":")[1]);
    mDrag={bi:bi,ti:ti,node:t,x:e.clientX,y:e.clientY,moved:false,over:null};
   });
  });
 });
 cards.forEach(c=>{
  c.addEventListener("pointerdown",e=>{

 });

}
document.addEventListener("pointermove",e=>{
 if(mDrag){
  if(!mDrag.moved){
   if(Math.abs(e.clientX-mDrag.x)+Math.abs(e.clientY-mDrag.y)<8)return;
   mDrag.moved=true;document.body.classList.add("mdragging");mDrag.node.classList.add("sel");
  }
  e.preventDefault();
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=under&&under.closest?under.closest(`[data-exdef^="${mDrag.bi}:"]`):null;
  if(mDrag.over&&mDrag.over!==tgt)mDrag.over.classList.remove("over");
  if(tgt)tgt.classList.add("over");
  mDrag.over=tgt;
  drawMatchLines({bi:mDrag.bi,ti:mDrag.ti,x:e.clientX,y:e.clientY});
  return;
 }
 if(sDrag){
  if(!sDrag.moved){
   if(Math.abs(e.clientX-sDrag.x)+Math.abs(e.clientY-sDrag.y)<8)return;
   sDrag.moved=true;document.body.classList.add("mdragging");sDrag.node.classList.add("dragging");

   ghostOn(`${pic?`<span class="gic">${pic.outerHTML}</span>`:""}<span>${sDrag.node.dataset.stxt||""}</span>`,e.clientX,e.clientY);
  }
  e.preventDefault();ghostMove(e.clientX,e.clientY);
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=under&&under.closest?under.closest("[data-zone]"):null;
  if(sDrag.over&&sDrag.over!==tgt)sDrag.over.classList.remove("over");
  if(tgt)tgt.classList.add("over");
  sDrag.over=tgt;
 }
},{passive:false});
document.addEventListener("pointerup",e=>{
 if(mDrag){
  const d=mDrag;mDrag=null;document.body.classList.remove("mdragging");
  if(d.over)d.over.classList.remove("over");

 }
 if(sDrag){

  if(d.over)d.over.classList.remove("over");

 }
});

async function createRoom(){
 const b=el.querySelector("#create");
 if(!onlineConfigured()){toast("Сначала подключи Supabase");return;}
 b.disabled=true;b.textContent="Проверяем соединение…";
 if(!(await S.ping())){toast(onlineHint());b.disabled=false;b.textContent="Создать занятие";return;}
 b.textContent="Создаём…";
 let code;
 for(let t=0;t<12;t++){
 const candidate=String(Math.floor(1000+Math.random()*9000));const existing=await S.get(kState(candidate));
 if(syncError){toast(onlineHint());b.disabled=false;b.textContent="Создать занятие";return;}
 if(!existing){code=candidate;break;}}
 if(!code){toast("Не удалось выбрать свободный код. Попробуй ещё раз.");b.disabled=false;b.textContent="Создать занятие";return;}
 const st={stage:0,phase:"theory",removed:[],updated:Date.now()};
 if(!(await S.set(kState(code),st))){toast(onlineHint());b.disabled=false;b.textContent="Создать занятие";return;}
 V.code=code;V.state=st;V.students=[];V.screen="teacher";rememberSession();render();startPoll("teacher");
}
async function removeStudent(id){
 if(V.screen!=="teacher"||!id)return;
 const student=V.students.find(s=>s.id===id);
 if(!student)return;
 if(!confirm("Отметить ученика "+student.name+" как выбывшего из занятия?"))return;
 const removed=Array.from(new Set([...(V.state.removed||[]),id]));
 const next={...V.state,removed,updated:Date.now()};
 if(!await S.set(kState(V.code),next)){toast("Не удалось удалить ученика");return;}
 await S.del(kStu(V.code,id));
 V.state=next;
 V.students=V.students.filter(s=>s.id!==id);
 render();toast("Ученик отмечен как выбывший");
}
async function commitStage(next){
 if(!await S.set(kState(V.code),next)){toast("Не удалось переключить этап. Проверь связь и попробуй ещё раз.");return false;}
 V.state=next;V.draft={};V.deck={set:next.phase==="task"?"task":"theory",i:0,zoom:false};V.notes=false;rememberSession();render();return true;
}
async function setPhase(p){if(V.screen!=="teacher")return;await commitStage({...V.state,phase:p,reveal:false,taskReveal:false,updated:Date.now()});}
async function gotoStage(n){
 if(V.screen!=="teacher"||n<0||n>=LESSON.stages.length)return;
 if(n>V.state.stage&&(!groupDone()||n!==V.state.stage+1)){toast("Сначала дождись ответов всей группы");return;}
 await commitStage({...V.state,stage:n,phase:"theory",reveal:false,taskReveal:false,updated:Date.now()});
}

async function finishLesson(){
 if(!V.code||!V.state||V.screen!=="teacher"||!groupDone())return;
 const b=el.querySelector("#next");

let warmT=null;

function warmTick(){
 const w=V.warm;if(!w||!w.on||w.paused)return;
 if(w.phase==="count"){
   w.n--;
   if(w.n<=0){w.phase="run";w.i=0;render();warmT=setTimeout(warmTick,w.speed);}
   else{render();warmT=setTimeout(warmTick,1000);}
   return;}
 if(w.phase==="run"){
   if(w.i>=WARM.length-1){w.phase="done";warmClear();render();return;}
   w.i++;render();warmT=setTimeout(warmTick,w.speed);}
}

async function pollTeacher(){
 if(!V.code)return;
 const rows=await S.entries(pStu(V.code));
 if(syncError)return;
 const removed=new Set((V.state&&V.state.removed)||[]);
 const out=rows.map(r=>r.value).filter(s=>s&&!removed.has(s.id));
 out.sort((a,b)=>(a.joined||0)-(b.joined||0));
 const sig=x=>JSON.stringify(x.map(s=>[s.id,s.name,s.role,s.active,s.mood,
   Object.entries(s.stages||{}).map(([k,v])=>k+":"+v.conf).join(","),JSON.stringify(s.polls||{}),JSON.stringify(s.progress||{})]));
 const ch=sig(out)!==sig(V.students);V.students=out;
 if(ch&&V.screen==="teacher")render();
}
async function pollStudent(){
 if(!V.code)return;
 const st=await S.get(kState(V.code));if(!st)return;
 if((st.removed||[]).includes(V.sid)){
  stopPoll();sessionStorage.removeItem("kiberurok-k4-investigation2-session");
  V.screen="join";V.me=null;V.sid=null;
  V.err="Учитель отметил прежнее подключение как выбывшее. Можно войти заново.";
  render();return;
 }
 const prev=V.state;
 const stageChanged=!prev||st.stage!==prev.stage||st.phase!==prev.phase;
 const revealChanged=!!st.reveal!==!!(prev&&prev.reveal)||!!st.warm!==!!(prev&&prev.warm)||!!st.taskReveal!==!!(prev&&prev.taskReveal);
 V.state=st;
 if(stageChanged||revealChanged){
   if(stageChanged)V.draft={};
   if(st.phase==="task"&&!(V.me.stages&&V.me.stages[st.stage])){V.me.active=true;S.set(kStu(V.code,V.sid),V.me);}
   render();}
}

let progressTimer=null,progressWrite=Promise.resolve(),progressSig="";
function progressPercent(){
 const T=LESSON.stages[V.state.stage].task,d=V.draft;
 if(T.type==="cases")return Math.min(100,Math.round((d.sel||[]).length/T.required*100));
 if(T.type==="yesno")return Math.round(Object.keys(d.yn||{}).length/T.items.length*100);
 if(T.type==="contracts")return Math.round(T.items.reduce((n,x,i)=>n+((d.pick||{})[i]!==undefined?1:0)+Math.min(2,((d.args||{})[i]||[]).length),0)/(T.items.length*3)*100);
 if(T.type==="exam")return Math.round((T.blocks.filter((b,i)=>exReady(b,(d.ex||{})[i])).length+(T.moods&&d.mood?1:0))/(T.blocks.length+(T.moods?1:0))*100);
 return 0;
}
function queueProgress(){

 progressTimer=setTimeout(()=>{if(!V.me||V.me.stages[stage]||V.state.stage!==stage)return;V.me.progress={stage,percent};V.me.active=true;const snapshot=JSON.parse(JSON.stringify(V.me));progressWrite=S.set(kStu(V.code,V.sid),snapshot);},450);
}

function ordText(s){return (s&&typeof s==="object")?(s.t||""):(s==null?"":s);}

function exLink(bi,ti,di){
 const D=exDraft();
 D.ex=D.ex||{};const a=D.ex[bi]=D.ex[bi]||{};a.map=a.map||{};
 Object.keys(a.map).forEach(k=>{if(Number(a.map[k])===di)delete a.map[k];});

function drawMatchLines(live){
 el.querySelectorAll(".mtch[data-mblock]").forEach(box=>{

   keep["l"+ti]=1;mLine(svg,"l"+ti,d,mcolor(ti),fresh);
  });

 });

/* --- готовность и подсчёт, включая новый тип «decode» --- */
function exReady(b,a){
 if(!a)return false;
 if(b.kind==="mcq")return Number.isInteger(a.choice);
 if(b.kind==="multi")return Array.isArray(a.multi)&&a.multi.length>0;
 if(b.kind==="match")return !!a.map&&Object.keys(a.map).length===b.pairs.length;
 if(b.kind==="order")return Array.isArray(a.order)&&a.order.length===b.steps.length;
 if(b.kind==="yn")return !!a.yn&&Object.keys(a.yn).length===b.items.length;
 if(b.kind==="decode"){const s=a.slots||{};return b.cells.every((c,i)=>s[i]!==undefined&&s[i]!==null);}
 return false;
}
function exScore(b,a){
 a=a||{};
 if(b.kind==="mcq")return{s:a.choice===b.ok?1:0,t:1};
 if(b.kind==="multi")return{s:sameSet(a.multi,b.ok)?1:0,t:1};
 if(b.kind==="match"){let s=0;const mp=a.map||{};b.pairs.forEach((p,i)=>{if(Number(mp[i])===i)s++;});return{s,t:b.pairs.length};}
 if(b.kind==="order"){const o=a.order||[];let s=0;b.steps.forEach((x,i)=>{if(o[i]===i)s++;});return{s,t:b.steps.length};}
 if(b.kind==="yn"){const y=a.yn||{};let s=0;b.items.forEach((x,i)=>{if(y[i]===x.ok)s++;});return{s,t:b.items.length};}
 if(b.kind==="decode"){const sl=a.slots||{};let s=0;b.answer.forEach((v,i)=>{if(sl[i]===v)s++;});return{s,t:b.answer.length};}
 return{s:0,t:1};
}
function decodeLabel(b,v){
 if(v===undefined||v===null)return "—";
 const o=(b.bank||[]).find(x=>x.v===v);
 return o?o.t:String(v);
}

   <div class="reviewgrid">${body}</div></div>`;
